[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
repobox_core = { path = "crates/repobox_core" }
repobox_ui = { path = "crates/repobox_ui" }
gpui-kit = { version = "=0.10.0", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
notify = "9"
dirs = "7"
rust-embed = "8"
log = "0.4"
env_logger = "0.11"
jiff = "1"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
