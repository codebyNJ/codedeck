<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codedeck Palette Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,350;1,9..144,420&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Grounds are only ever pure white or pure black. */
:root { --ground: #ffffff; --fig: #000000; --sub: rgba(0,0,0,.55); --rule: rgba(0,0,0,.14);
  --field: #ffffff; --fieldfg: #000000; --fieldsub: rgba(0,0,0,.55); --acc: #e45e4d; --s: "Fraunces", Georgia, serif; --m: "Geist Mono", ui-monospace, monospace; }
:root[data-ground="black"] { --ground: #000000; --fig: #ffffff; --sub: rgba(255,255,255,.55); --rule: rgba(255,255,255,.16); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--fig); font: 14px/1.4 "Instrument Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; transition: background .35s, color .35s; }
.it { font-family: var(--s); font-style: italic; font-weight: 350; letter-spacing: -.01em; }
.lab { font: 500 10px/1.25 var(--m); text-transform: uppercase; letter-spacing: .08em; color: var(--sub); }
.lab b { color: var(--fig); font-weight: 500; }

/* top bar: two switches, nothing else */
.bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 18px; padding: 14px 28px; background: var(--ground); border-bottom: 1px solid var(--rule); transition: background .35s; }
.bar .nm { font-weight: 600; letter-spacing: -.02em; display: flex; align-items: center; gap: 9px; }
.sp { flex: 1; }
.sw2 { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 3px; }
.sw2 button { border: 0; background: none; color: var(--sub); font: 500 12px "Instrument Sans"; padding: 5px 12px; border-radius: 999px; cursor: default; }
.sw2 button.on { background: var(--fig); color: var(--ground); }

/* the board: bands separated by hairlines, pieces scattered across a 12-col grid */
.band { position: relative; display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 24px; row-gap: 40px; padding: 46px 28px 56px; border-bottom: 1px solid var(--rule); align-items: start; }
.band > .tag { position: absolute; top: 12px; left: 28px; right: 28px; display: flex; justify-content: space-between; }
.piece { position: relative; }
.piece > .lab { margin-top: 9px; display: flex; justify-content: space-between; gap: 10px; }
.frame { position: relative; overflow: hidden; }
/* crop handles, the board's one ornament */
.crop::before, .crop::after, .crop > .h::before, .crop > .h::after { content: ""; position: absolute; width: 6px; height: 6px; background: var(--fig); z-index: 3; }
.crop::before { left: -3px; top: -3px; } .crop::after { right: -3px; top: -3px; }
.crop > .h::before { left: -3px; bottom: -3px; } .crop > .h::after { right: -3px; bottom: -3px; }
.crop { overflow: visible; } .crop > .in { position: relative; overflow: hidden; width: 100%; height: 100%; }
@media (max-width: 900px) { .band { grid-template-columns: repeat(2, 1fr); padding: 46px 16px 40px; } .band > .piece { grid-column: auto / span 2 !important; margin-top: 0 !important; } .bar { padding: 12px 16px; flex-wrap: wrap; } }

/* swatches */
.chip { aspect-ratio: 3/4; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; font: 500 10px var(--m); letter-spacing: .06em; text-transform: uppercase; }
.chip.wide { aspect-ratio: 16/10; }
.chip.edge { box-shadow: inset 0 0 0 1px var(--rule); }
.mix { display: flex; height: 22px; } .mix i { display: block; }

/* robot: one element, sized by font-size */
.bot { display: block; position: relative; width: 1em; height: 1em; border-radius: .29em; background: var(--botc, #e45e4d); flex: none; }
.bot .v { position: absolute; left: .13em; right: .13em; top: .26em; height: .25em; border-radius: .2em; background: #000; display: grid; place-items: center; }
.bot .v i { width: 58%; height: .055em; border-radius: .03em; background: var(--slit, #ff7a68); }
.bot .g { position: absolute; left: 0; right: 0; bottom: .19em; display: flex; justify-content: center; gap: .055em; }
.bot .g i { width: .055em; height: .14em; border-radius: .03em; background: #000; opacity: .8; }

/* type helpers inside artwork */
.big { font-weight: 600; letter-spacing: -.045em; line-height: .92; }
.mid { font-weight: 500; letter-spacing: -.03em; line-height: 1.02; }
.art { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.px { image-rendering: pixelated; display: block; width: 100%; height: 100%; object-fit: cover; }
.cover { width: 100%; height: 100%; object-fit: cover; display: block; }
.dots { display: flex; gap: 4px; } .dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .3; } .dots i.on { opacity: 1; }
.rot { writing-mode: vertical-rl; transform: rotate(180deg); }
</style>
</head>
<body>
<div class="bar">
  <span class="nm"><span class="bot" style="font-size:22px"><span class="v"><i></i></span><span class="g"><i></i><i></i><i></i><i></i></span></span>Codedeck <span class="lab" style="margin-left:6px">Palette board · 002</span></span>
  <span class="sp"></span>
  <span class="lab">Ground</span><div class="sw2" id="ground"><button class="on" data-v="white">White</button><button data-v="black">Black</button></div>
  <span class="lab">Direction</span><div class="sw2" id="dir"><button class="on" data-v="mono">Mono</button><button data-v="stamp">Stamp</button><button data-v="meadow">Meadow</button><button data-v="painting">Painting</button></div>
</div>
<main id="board"></main>

<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];

/* ---- colours ---- */
const C = {
  white: "#ffffff", black: "#000000", stamp: "#e45e4d", slit: "#ff7a68", meadow: "#4caf50", deep: "#2e7d38", petal: "#ff7eb6", sky: "#76b6f0", sun: "#ffd166",
  live: "#2ea56a", amber: "#9a5c17", warm: "#fbf0e1", slate: "#4e6a88",
};
const ROLES = [
  ["White", C.white, "Ground · light", "01"], ["Black", C.black, "Ground · dark · text", "02"], ["Stamp", C.stamp, "The robot · brand", "03"],
  ["Meadow", C.meadow, "Film · posters", "04"], ["Petal", C.petal, "Sparks", "05"], ["Sky", C.sky, "Film · fields", "06"], ["Sun", C.sun, "Highlights", "07"],
  ["Live", C.live, "Running", "08"], ["Amber", C.amber, "Uncommitted", "09"], ["Slate", C.slate, "Italic accent", "10"],
];
const ink = hex => { const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255); return .2126 * r + .7152 * g + .0722 * b > .5 ? "#000000" : "#ffffff"; };

/* ---- the pixel meadow, drawn once and reused as an image ---- */
function meadowURL(W = 236, H = 148, seed = 7) {
  const c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d");
  let s = seed; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const SKY = ["#76b6f0", "#a0cef6", "#c6e2fa", "#e4f2fd", "#f6fbff"], top = H * .75;
  for (let y = 0; y < top; y++) for (let x = 0; x < W; x++) { const f = Math.min(1, y / top) * 4, i = Math.floor(f), fr = f - i; g.fillStyle = SKY[fr * 16 > BAYER[y % 4][x % 4] ? Math.min(4, i + 1) : i]; g.fillRect(x, y, 1, 1); }
  for (let x = 0; x < W; x++) { const h1 = H * .57 + Math.sin(x / 26) * 6 + Math.sin(x / 9) * 2; g.fillStyle = "#b7dea3"; g.fillRect(x, h1, 1, H); const h2 = H * .68 + Math.sin(x / 18 + 2) * 5; g.fillStyle = "#88c870"; g.fillRect(x, h2, 1, H); }
  g.fillStyle = "#4caf50"; g.fillRect(0, H * .8, W, H);
  for (let i = 0; i < W * 1.8; i++) { const x = rnd() * W, h = 5 + rnd() * 12; g.fillStyle = ["#4caf50", "#3b9a45", "#6cc04a", "#2e7d38", "#7ccf5a"][Math.floor(rnd() * 5)]; for (let k = 0; k < h; k++) g.fillRect(Math.round(x + (k / h) * 1.4), H - k, 1, 1); }
  for (let i = 0; i < 30; i++) { g.fillStyle = ["#ff7eb6", "#ffd166", "#ffffff", "#ff5c9a"][Math.floor(rnd() * 4)]; g.fillRect(rnd() * W, H * .83 + rnd() * H * .15, 2, 2); }
  g.fillStyle = "#ffffff"; [[.12, .14], [.62, .22], [.85, .1]].forEach(([x, y]) => { g.fillRect(x * W, y * H, 22, 4); g.fillRect(x * W + 4, y * H - 3, 12, 3); });
  g.fillStyle = "#ff7eb6"; for (let i = 0; i < 16; i++) g.fillRect(rnd() * W, rnd() * top, 1, 1);
  return c.toDataURL();
}
const MEADOW = meadowURL(), MEADOW_TALL = meadowURL(120, 200, 11);
const PAINT = ["assets/art/wheat-day.jpg", "assets/art/jatte.jpg", "assets/art/wheat-summer.jpg", "assets/art/farm.jpg"];

/* ---- robot ---- */
const bot = (size, body = C.stamp, extra = "") => `<span class="bot" style="font-size:${size}px;--botc:${body};${extra}"><span class="v"><i></i></span><span class="g"><i></i><i></i><i></i><i></i></span></span>`;

/* ---- a direction decides what a "field" is: flat colour, art, and its text colours ---- */
function look(dir, ground) {
  const g = ground === "black" ? C.black : C.white, f = ground === "black" ? C.white : C.black;
  return {
    mono: { bg: g, fg: f, sub: f === C.black ? "rgba(0,0,0,.55)" : "rgba(255,255,255,.6)", art: "", acc: C.stamp, edge: true },
    stamp: { bg: C.stamp, fg: C.black, sub: "rgba(0,0,0,.6)", art: "", acc: C.black, botc: C.black, slit: C.stamp },
    meadow: { bg: C.sky, fg: C.black, sub: "rgba(0,0,0,.6)", art: MEADOW, acc: C.petal },
    painting: { bg: "#3a3a2e", fg: C.white, sub: "rgba(255,255,255,.78)", art: PAINT[0], paint: true, acc: C.sun },
  }[dir];
}
const field = (L, art = true, n = 0) => {
  const img = !art || !L.art ? "" : L.paint ? `<img class="cover" src="${PAINT[n % 4]}"><i style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent 65%)"></i>` : `<img class="px" src="${L.art}" style="position:absolute;inset:0">`;
  return `background:${L.bg};color:${L.fg};${L.edge ? "box-shadow:inset 0 0 0 1px var(--rule);" : ""}" data-art="${img ? 1 : 0}">${img}`;
};
const robotIn = (L, size) => bot(size, L.botc || C.stamp, L.slit ? `--slit:${L.slit}` : "");

/* ---- pieces ---- */
const ART_W = 360;
const piece = (col, ratio, inner, label, size = "", top = 0) => {
  const [w, h] = ratio.split("/").map(Number);
  return `<div class="piece" style="grid-column:${col};margin-top:${top}px"><div class="frame crop" style="aspect-ratio:${ratio}"><i class="h"></i><div class="in"><div class="art" style="width:${ART_W}px;height:${ART_W * h / w}px">${inner}</div></div></div><div class="lab"><span><b>${label}</b></span><span>${size}</span></div></div>`;
};
const fit = () => $$(".art").forEach(a => (a.style.transform = `scale(${a.parentElement.clientWidth / ART_W})`));
addEventListener("resize", fit);

function poster(L, kind) {
  if (kind === 0) return `<div style="position:absolute;inset:0;${field(L)}<div style="position:absolute;inset:0;padding:8%;display:flex;flex-direction:column;justify-content:space-between">
      <div style="display:flex;justify-content:space-between" class="lab"><span style="color:${L.sub}">Codedeck · 001</span><span style="color:${L.sub}">macOS</span></div>
      <div style="display:grid;place-items:center">${robotIn(L, 120)}</div>
      <div><div class="big" style="font-size:44px">One deck.</div><div class="it" style="font-size:30px;margin-top:4px;color:${L.fg}">every agent in it.</div></div></div></div>`;
  if (kind === 1) return `<div style="position:absolute;inset:0;${field(L, true, 1)}<div style="position:absolute;inset:0;padding:8%;display:flex;flex-direction:column;justify-content:flex-end;gap:10px">
      <div class="big" style="font-size:86px">436</div><div class="mid" style="font-size:22px">agent sessions.<br><span class="it">I couldn't find one.</span></div></div></div>`;
  if (kind === 2) return `<div style="position:absolute;inset:0;background:${L.bg === C.stamp ? C.stamp : L.bg};color:${L.fg};${L.edge ? "box-shadow:inset 0 0 0 1px var(--rule)" : ""}"><div style="position:absolute;inset:0;padding:8%;display:grid;grid-template-rows:auto 1fr auto">
      <div class="lab" style="color:${L.sub}">Field guide · 03</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-content:center">${["#ffffff", "#000000", C.stamp, C.meadow, C.petal, C.sky, C.sun, C.live].map(c => `<i style="aspect-ratio:1;background:${c};box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)"></i>`).join("")}</div>
      <div class="mid" style="font-size:24px">White, black,<br><span class="it">one red robot.</span></div></div></div>`;
  return `<div style="position:absolute;inset:0;${field(L, true, 2)}<div style="position:absolute;inset:0;padding:8%;display:flex;flex-direction:column;justify-content:space-between">
      <div class="rot big" style="font-size:50px;align-self:flex-end">Calm software</div><div class="lab" style="color:${L.sub}">No account · no cloud · one price</div></div></div>`;
}

function thumb(L, kind) {
  if (kind === 0) return `<div style="position:absolute;inset:0;${field(L)}<div style="position:absolute;inset:0;padding:6%;display:flex;align-items:center;gap:6%">
      ${robotIn(L, 92)}<div class="big" style="font-size:40px">I lost 436<br>AI sessions</div></div></div>`;
  if (kind === 1) return `<div style="position:absolute;inset:0;background:${L.paint ? "#000" : L.bg};color:${L.paint ? "#fff" : L.fg};${L.edge ? "box-shadow:inset 0 0 0 1px var(--rule)" : ""}"><div style="position:absolute;inset:0;padding:6%;display:grid;grid-template-columns:1fr 1fr;gap:6%;align-items:center">
      <div><div class="lab" style="color:inherit;opacity:.6">Rust · GPUI</div><div class="mid" style="font-size:30px;margin-top:8px">Jelly buttons<br><span class="it">without CSS</span></div></div>
      <div style="display:grid;place-items:center"><div style="padding:10px 18px;border-radius:12px;background:${L.fg};color:${L.paint ? "#000" : L.bg};font-weight:500;font-size:16px;transform:scale(1.1,.86)">Press me</div></div></div></div>`;
  return `<div style="position:absolute;inset:0;${field(L, true, 3)}<div style="position:absolute;inset:0;padding:6%;display:flex;flex-direction:column;justify-content:flex-end">
      <div class="big" style="font-size:38px">Where does Claude Code<br><span class="it" style="font-weight:350">keep your sessions?</span></div></div></div>`;
}

function slide(L, n) {
  const pg = `<div class="dots" style="color:${L.fg}">${[0, 1, 2, 3, 4, 5].map(i => `<i class="${i === n ? "on" : ""}"></i>`).join("")}</div>`;
  const frame = (body, art = false) => `<div style="position:absolute;inset:0;${art ? field(L, true, n) : `background:${L.paint || L.art ? (n % 2 ? L.bg : (L.paint ? "#000" : "#fff")) : L.bg};color:${L.paint || L.art ? (n % 2 ? L.fg : (L.paint ? "#fff" : "#000")) : L.fg};${L.edge ? "box-shadow:inset 0 0 0 1px var(--rule)" : ""}">`}<div style="position:absolute;inset:0;padding:9%;display:flex;flex-direction:column;justify-content:space-between">${body}${pg}</div></div>`;
  return [
    frame(`<div><div class="lab" style="color:inherit;opacity:.6">1 / 6</div><div class="big" style="font-size:40px;margin-top:14px">37 projects.<br>436 sessions.</div><div class="it" style="font-size:22px;margin-top:8px">Here's where they hide.</div></div>`, true),
    frame(`<div class="mid" style="font-size:26px">Claude keeps every session in <span class="mono" style="font:500 18px var(--m)">~/.claude/projects</span>, named after a mangled path.</div>`),
    frame(`<div class="mid" style="font-size:26px">OpenCode keeps them in a <span class="it">SQLite file.</span> Codex in dated folders.</div>`),
    frame(`<div style="display:grid;place-items:center;flex:1">${robotIn(L, 110)}</div><div class="mid" style="font-size:24px">Codedeck reads all three and puts each session under its project.</div>`, true),
    frame(`<div style="display:flex;flex-direction:column;gap:8px">${["dccd · fix/learn-home-uniform · 2 uncommitted", "xam-reloaded · 5 sessions", "Syncup-Mobile-app · running"].map(t => `<div style="padding:10px 12px;border-radius:12px;border:1px solid currentColor;font-size:13px;opacity:.9">${t}</div>`).join("")}</div>`),
    frame(`<div><div class="big" style="font-size:36px">15 days free.<br><span class="it" style="font-weight:350">Then one price.</span></div><div class="lab" style="color:inherit;opacity:.6;margin-top:14px">codedeck.app</div></div>`, true),
  ][n];
}

function social(L, kind) {
  if (kind === "x") return `<div style="position:absolute;inset:0;${field(L)}<div style="position:absolute;inset:0;padding:7%;display:flex;flex-direction:column;justify-content:space-between">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="lab" style="color:${L.sub}">Codedeck · day 12</span>${robotIn(L, 28)}</div>
      <div class="mid" style="font-size:30px">Every project on your Mac,<br><span class="it">and every agent in it.</span></div></div></div>`;
  if (kind === "square") return `<div style="position:absolute;inset:0;${field(L, true, 1)}<div style="position:absolute;inset:0;padding:9%;display:flex;flex-direction:column;justify-content:space-between">
      <div class="lab" style="color:${L.sub}">Good morning.</div><div class="big" style="font-size:48px">163<div class="mid" style="font-size:18px;margin-top:6px">files waiting to be committed</div></div></div></div>`;
  if (kind === "story") return `<div style="position:absolute;inset:0;${L.art && !L.paint ? `background:${L.bg};color:${L.fg}"><img class="px" src="${MEADOW_TALL}" style="position:absolute;inset:0">` : field(L, true, 3)}<div style="position:absolute;inset:0;padding:10%;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center">
      <div class="lab" style="color:${L.sub}">New · macOS</div>${robotIn(L, 86)}<div class="mid" style="font-size:26px">Where you<br><span class="it">left off.</span></div></div></div>`;
  return `<div style="position:absolute;inset:0;${field(L, true, 0)}<div style="position:absolute;inset:0;padding:0 5%;display:flex;align-items:center;gap:20px">${robotIn(L, 54)}<div class="mid" style="font-size:26px">Codedeck <span class="it">for Mac</span></div><span style="flex:1"></span><span class="lab" style="color:${L.sub}">codedeck.app</span></div></div>`;
}

/* ---- the board ---- */
function render() {
  const ground = $("#ground .on").dataset.v, dir = $("#dir .on").dataset.v, L = look(dir, ground);
  const bands = [];

  // 01 — palette, scattered
  bands.push(`<section class="band"><div class="tag"><span class="lab">0.1 <b>Palette</b></span><span class="lab">Ten colours · two grounds</span></div>
    ${ROLES.map(([n, hex, role, no], i) => {
      const cols = ["1 / span 2", "4 / span 2", "7 / span 2", "10 / span 2", "2 / span 2", "5 / span 2", "8 / span 2", "11 / span 2", "3 / span 2", "9 / span 2"], tops = [0, 60, 10, 90, 20, 0, 70, 30, 0, 40];
      return `<div class="piece" style="grid-column:${cols[i]};margin-top:${tops[i]}px"><div class="frame crop"><i class="h"></i><div class="in"><div class="chip ${hex === "#ffffff" || hex === "#000000" ? "edge" : ""}" style="background:${hex};color:${ink(hex)}"><span>${no}</span><span>${hex.toUpperCase()}</span></div></div></div><div class="lab"><span><b>${n}</b></span><span>${role}</span></div></div>`;
    }).join("")}
    <div class="piece" style="grid-column:1 / span 12"><div class="lab" style="margin-bottom:8px"><span><b>Proportion</b> on any surface</span><span>Ground 70 · Black/White 18 · Stamp 4 · Meadow 5 · Signal 3</span></div>
      <div class="mix" style="box-shadow:inset 0 0 0 1px var(--rule)"><i style="flex:70;background:var(--ground)"></i><i style="flex:18;background:var(--fig)"></i><i style="flex:4;background:${C.stamp}"></i><i style="flex:2;background:${C.meadow}"></i><i style="flex:1.5;background:${C.sky}"></i><i style="flex:1;background:${C.petal}"></i><i style="flex:.5;background:${C.sun}"></i><i style="flex:3;background:${C.live}"></i></div></div>
  </section>`);

  // 02 — posters
  bands.push(`<section class="band"><div class="tag"><span class="lab">0.2 <b>Posters</b></span><span class="lab">A-series · 2:3</span></div>
    ${piece("1 / span 3", "2/3", poster(L, 0), "One deck", "1080 × 1620", 0)}
    ${piece("5 / span 3", "2/3", poster(L, 1), "436", "1080 × 1620", 120)}
    ${piece("8 / span 2", "2/3", poster(L, 2), "Field guide", "A4", 40)}
    ${piece("10 / span 3", "2/3", poster(L, 3), "Calm software", "1080 × 1620", 0)}
  </section>`);

  // 03 — thumbnails
  bands.push(`<section class="band"><div class="tag"><span class="lab">0.3 <b>Thumbnails</b></span><span class="lab">YouTube · blog · 16:9</span></div>
    ${piece("1 / span 5", "16/9", thumb(L, 0), "Story", "1280 × 720", 0)}
    ${piece("7 / span 4", "16/9", thumb(L, 1), "Build in public", "1280 × 720", 70)}
    ${piece("3 / span 4", "16/9", thumb(L, 2), "SEO guide", "1280 × 720", 0)}
    <div class="piece" style="grid-column:9 / span 3;margin-top:30px"><div class="lab" style="flex-direction:column;gap:6px"><span><b>Rule</b></span><span>Robot or one big number on the left, five words max, never a screenshot as the whole thumbnail.</span></div></div>
  </section>`);

  // 04 — carousel
  bands.push(`<section class="band"><div class="tag"><span class="lab">0.4 <b>Carousel</b></span><span class="lab">LinkedIn · Instagram · 4:5 · 6 slides</span></div>
    ${[0, 1, 2, 3, 4, 5].map(n => piece(`${n * 2 + 1} / span 2`, "4/5", slide(L, n), `Slide ${n + 1}`, n === 0 ? "1080 × 1350" : "", n % 2 ? 36 : 0)).join("")}
  </section>`);

  // 05 — social set
  bands.push(`<section class="band"><div class="tag"><span class="lab">0.5 <b>Social set</b></span><span class="lab">X · Instagram · Story · Banner</span></div>
    ${piece("1 / span 5", "16/9", social(L, "x"), "X / link card", "1200 × 675", 0)}
    ${piece("7 / span 3", "1/1", social(L, "square"), "Square post", "1080 × 1080", 60)}
    ${piece("11 / span 2", "9/16", social(L, "story"), "Story / Reel", "1080 × 1920", 0)}
    ${piece("2 / span 8", "4/1", social(L, "banner"), "Profile banner", "1500 × 375", 10)}
  </section>`);

  // 06 — what if: the same X post in every direction and ground, always shown
  const variants = [["mono", "white", "Mono · white"], ["mono", "black", "Mono · black"], ["stamp", "white", "Stamp"], ["meadow", "white", "Meadow"], ["painting", "white", "Painting"]];
  bands.push(`<section class="band"><div class="tag"><span class="lab">0.6 <b>What if</b> · the same post, every version</span><span class="lab">Pick per channel</span></div>
    ${variants.map(([d, g, n], i) => piece(["1 / span 4", "5 / span 4", "9 / span 4", "3 / span 4", "7 / span 4"][i], "16/9", social(look(d, g), "x"), n, ["Default · product", "Default · dark", "Launch day", "Onboarding · fun", "Mornings · calm"][i], i > 2 ? 20 : 0)).join("")}
  </section>`);

  // 07 — marks
  bands.push(`<section class="band"><div class="tag"><span class="lab">0.7 <b>Marks</b></span><span class="lab">Icon · glyph · stickers · lockups</span></div>
    ${piece("1 / span 2", "1/1", `<div style="position:absolute;inset:0;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);display:grid;place-items:center">${bot(110)}</div>`, "Icon on white", "1024")}
    ${piece("3 / span 2", "1/1", `<div style="position:absolute;inset:0;background:#000;display:grid;place-items:center">${bot(110)}</div>`, "Icon on black", "1024", 40)}
    ${piece("6 / span 3", "16/9", `<div style="position:absolute;inset:0;background:var(--ground);box-shadow:inset 0 0 0 1px var(--rule);display:flex;align-items:center;justify-content:center;gap:14px">${bot(52)}<span style="font-size:40px;font-weight:600;letter-spacing:-.04em">Codedeck</span></div>`, "Lockup", "Horizontal", 0)}
    ${piece("10 / span 3", "16/9", `<div style="position:absolute;inset:0;background:${C.stamp};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#000">${bot(64, "#000", "--slit:" + C.stamp)}<span style="font-size:26px;font-weight:600;letter-spacing:-.03em">Codedeck</span></div>`, "Lockup on stamp", "Stacked", 50)}
    ${piece("2 / span 2", "1/1", `<div style="position:absolute;inset:0;background:var(--ground);display:grid;place-items:center"><div style="padding:22px;border-radius:52px;background:#fff;box-shadow:0 0 0 3px #000;transform:rotate(-7deg)">${bot(170)}</div></div>`, "Sticker", "Die-cut", 10)}
    ${piece("5 / span 2", "1/1", `<div style="position:absolute;inset:0;background:var(--ground);display:grid;place-items:center"><div style="padding:22px 30px;border-radius:999px;background:${C.stamp};color:#000;transform:rotate(5deg);font-weight:600;font-size:38px;letter-spacing:-.02em">open to <span class="it" style="font-weight:420">continue</span></div></div>`, "Sticker", "Die-cut", 50)}
    ${piece("8 / span 4", "4/1", `<div style="position:absolute;inset:0;background:var(--ground);box-shadow:inset 0 0 0 1px var(--rule);display:flex;align-items:center;justify-content:space-around">${[16, 24, 32, 48, 64].map(s => `<div style="display:flex;flex-direction:column;align-items:center;gap:6px">${bot(s)}<span class="lab">${s}</span></div>`).join("")}</div>`, "Glyph sizes", "Menu bar → dock", 30)}
  </section>`);

  // 08 — app grounds
  bands.push(`<section class="band"><div class="tag"><span class="lab">0.8 <b>App grounds</b></span><span class="lab">Pure white · pure black · no greys behind content</span></div>
    ${["#ffffff", "#000000"].map((bg, i) => {
      const fg = i ? "#fff" : "#000", line = i ? "rgba(255,255,255,.16)" : "rgba(0,0,0,.12)", pill = i ? "rgba(255,255,255,.1)" : "rgba(0,0,0,.05)";
      return piece(i ? "7 / span 6" : "1 / span 6", "16/10", `<div style="position:absolute;inset:0;background:${bg};color:${fg};display:grid;grid-template-columns:28% 1fr;${i ? "" : "box-shadow:inset 0 0 0 1px var(--rule)"}">
        <div style="border-right:1px solid ${line};padding:12% 10%;display:flex;flex-direction:column;gap:9px;font-size:12px">${bot(18)}<b style="margin-top:6px">Home</b><span style="opacity:.6">Settings</span><span class="lab" style="color:inherit;opacity:.5;margin-top:8px">Recent</span><span style="opacity:.8">codedeck</span><span style="opacity:.8">dccd</span></div>
        <div style="padding:7%;display:flex;flex-direction:column;gap:10px"><div class="it" style="font-size:26px">Good morning.</div>
          ${["codedeck", "Syncup-Mobile-app"].map((p, k) => `<div style="border:1px solid ${k ? C.live : line};border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:13px">${bot(26, k ? C.petal : C.sky)}<div style="flex:1">${p}<div style="display:flex;gap:4px;margin-top:5px"><span style="background:${pill};border-radius:5px;padding:1px 6px;font-size:10.5px">main</span><span style="background:${i ? "#33261a" : C.warm};color:${i ? "#e3a55c" : C.amber};border-radius:5px;padding:1px 6px;font-size:10.5px">3 uncommitted</span></div></div>${k ? `<span style="background:${C.live};color:#fff;border-radius:5px;padding:1px 6px;font-size:10px">Running</span>` : ""}</div>`).join("")}
        </div></div>`, i ? "Dark · #000000" : "Light · #FFFFFF", "Cards: hairlines only", i * 40);
    }).join("")}
  </section>`);

  $("#board").innerHTML = bands.join("");
  fit();
}

const pick = (id, cb) => $$(`#${id} button`).forEach(b => b.onclick = () => { $$(`#${id} button`).forEach(x => x.classList.toggle("on", x === b)); cb(b.dataset.v); render(); });
pick("ground", v => (document.documentElement.dataset.ground = v));
pick("dir", () => {});
// ?ground=black&dir=meadow opens a specific version (handy for sharing one)
const q = new URLSearchParams(location.search);
["ground", "dir"].forEach(k => { const v = q.get(k), b = v && $(`#${k} button[data-v="${v}"]`); if (b) { $$(`#${k} button`).forEach(x => x.classList.toggle("on", x === b)); if (k === "ground") document.documentElement.dataset.ground = v; } });
render();
</script>
</body>
</html>
