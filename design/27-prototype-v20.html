<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Codedeck — Prototype v20</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=Instrument+Sans:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #fff; --soft: #f5f5f3; --soft-2: #ededea; --ink: #111112; --ink-2: #4f4f55; --ink-3: #8a8a90; --ink-4: #c4c4c7;
  --line: #ebebe8; --line-2: #dfdfdb; --red: #e45e4d; --live: #2ea56a; --amber: #9a5c17;
  --f: "Instrument Sans", system-ui, sans-serif; --s: "Fraunces", Georgia, serif; --m: "Geist Mono", ui-monospace, monospace;
  --sv: "opsz" 144, "SOFT" 100; --spring: cubic-bezier(.3,1.4,.5,1); --out: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: #ececea; font-family: var(--f); color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; font-size: 13px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.mono { font-family: var(--m); }
.ser { font-family: var(--s); font-weight: 400; font-variation-settings: var(--sv); letter-spacing: -.02em; }
.it { font-family: var(--s); font-style: italic; font-weight: 400; font-variation-settings: var(--sv); }
.meta { font: 10.5px var(--m); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.w { display: inline-block; }

.stage { position: fixed; inset: 0 0 64px; }
.scaler { position: absolute; left: 50%; top: 50%; width: 1180px; height: 740px; }
.win { position: relative; width: 1180px; height: 740px; border-radius: 14px; overflow: hidden; background: var(--bg); box-shadow: 0 0 0 1px rgba(0,0,0,.09); }
.lights { position: absolute; z-index: 50; top: 16px; left: 16px; display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: rgba(128,128,128,.28); }
.app .lights i:nth-child(1) { background: #ff5f57; } .app .lights i:nth-child(2) { background: #febc2e; } .app .lights i:nth-child(3) { background: #28c840; }
.scr { position: absolute; inset: 0; }
.nav { position: fixed; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; }
.nav > div { display: flex; align-items: center; }
.nav .ver { margin-left: 12px; font: 10.5px var(--m); color: var(--ink-3); }

/* ============ motion system: gel buttons, squish knobs ============ */
.gel { --top: #303033; --base: #111112; --fg: #fff; position: relative; isolation: isolate; display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 16px; border-radius: 99px; white-space: nowrap; font-weight: 500; font-size: 13px; color: var(--fg); background: linear-gradient(180deg, var(--top), var(--base) 75%); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -3px 7px rgba(0,0,0,.4); transition: transform .45s var(--spring); }
.gel::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; opacity: 0; transition: opacity .3s; background: radial-gradient(110px 50px at var(--mx,50%) var(--my,0%), rgba(255,255,255,.24), transparent 70%); }
.gel:hover::before { opacity: 1; }
.gel:hover { transform: scale(1.03); }
.gel:active { transform: scale(.95,.88); transition-duration: .08s; }
.gel[data-m="wob"] { animation: wob .55s var(--spring); }
.gel[data-m="jelly"] { animation: jelly .6s var(--spring); }
.gel.paper { --top: #fff; --base: #f3f3f1; --fg: var(--ink); box-shadow: inset 0 0 0 1px rgba(14,14,15,.11), inset 0 1px 0 #fff, inset 0 -2px 3px rgba(14,14,15,.05); }
.gel.paper::before { background: radial-gradient(110px 50px at var(--mx,50%) var(--my,0%), rgba(14,14,15,.05), transparent 70%); }
.gel.lg { height: 42px; padding: 0 24px; font-size: 14px; }
.gel.sm { height: 28px; padding: 0 12px; font-size: 12px; }
.gel.ico { width: 34px; padding: 0; } .gel.sm.ico { width: 28px; }
.gel svg { width: 13px; height: 13px; flex-shrink: 0; }
@keyframes wob { 30% { transform: scale(1.05,.95); } 55% { transform: scale(.985,1.03); } 78% { transform: scale(1.01,.995); } 100% { transform: scale(1.03); } }
@keyframes jelly { 0% { transform: scale(.95,.88); } 32% { transform: scale(1.07,.94); } 58% { transform: scale(.97,1.04); } 80% { transform: scale(1.015,.99); } 100% { transform: scale(1); } }
.split { position: relative; display: inline-flex; gap: 2px; }
.split > .gel:first-child { border-radius: 99px 6px 6px 99px; padding-right: 13px; }
.split > .gel.chev { border-radius: 6px 99px 99px 6px; width: 30px; padding: 0 2px 0 0; }

.seg { position: relative; display: inline-flex; padding: 3px; border-radius: 99px; background: rgba(14,14,15,.055); }
.seg > button { position: relative; z-index: 1; height: 28px; padding: 0 13px; border-radius: 99px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; transition: color .25s; display: inline-flex; align-items: center; gap: 6px; }
.seg > button:hover { color: var(--ink); }
.seg > button[aria-checked="true"] { color: #fff; }
.seg > button .c { font: 10.5px var(--m); opacity: .55; }
.seg > button .ag i { font-style: normal; }
.seg .knob { position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 99px; background: linear-gradient(180deg, #333336, #111112 80%); box-shadow: inset 0 1px 0 rgba(255,255,255,.22); }
.seg.paper .knob { background: #fff; box-shadow: 0 0 0 1px rgba(14,14,15,.1); }
.seg.paper > button[aria-checked="true"] { color: var(--ink); }
.seg.sm > button { height: 24px; padding: 0 10px; font-size: 12px; }
.seg.lg > button { height: 34px; padding: 0 16px; font-size: 13.5px; }

.chip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 99px; font: 500 13.5px var(--f); color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line-2); transition: background .25s, color .25s, box-shadow .25s; }
.chip .ck { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--ink-4); transition: background .25s, box-shadow .25s; }
.chip .ck svg { width: 9px; height: 9px; opacity: 0; transform: scale(.4); transition: opacity .2s, transform .4s var(--spring); }
.chip[aria-checked="true"] { color: var(--ink); background: #fff; box-shadow: inset 0 0 0 1.5px var(--ink); }
.chip[aria-checked="true"] .ck { background: var(--ink); box-shadow: none; } .chip[aria-checked="true"] .ck svg { opacity: 1; transform: none; }
.chip.mono { font: 13px var(--m); } .chip .n { font: 11px var(--m); color: var(--ink-3); }
.chip.off { color: var(--ink-4); cursor: default; box-shadow: inset 0 0 0 1px var(--line); }
.chip[data-m="jelly"] { animation: jelly .6s var(--spring); }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; background: var(--soft); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.pill b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.pill svg { width: 12px; height: 12px; }
.pill.warn { background: #fbf0e1; color: var(--amber); } .pill.warn b { color: var(--amber); }
.pill.live { background: #e7f5ed; color: #1f744a; } .pill.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--live); animation: pulse 1.8s infinite; }
.pill.out { background: #fff; box-shadow: inset 0 0 0 1px var(--line-2); }
@keyframes pulse { 50% { opacity: .35; } }
.menu { position: absolute; z-index: 30; left: 0; top: calc(100% + 6px); min-width: 186px; padding: 5px; border-radius: 14px; background: #fff; box-shadow: 0 0 0 1px var(--line-2), 0 18px 40px -18px rgba(0,0,0,.28); display: none; transform-origin: 20% 0; }
.menu.open { display: block; animation: pop .45s var(--spring); }
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.92, .86); } }
.menu button { display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 10px; border-radius: 9px; font-size: 13px; text-align: left; }
.menu button:hover { background: var(--soft); }
.menu button svg { width: 14px; height: 14px; color: var(--ink-3); }
.menu button .k { margin-left: auto; font: 10.5px var(--m); color: var(--ink-3); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.av { display: block; border-radius: 26%; flex-shrink: 0; }
.si { display: block; flex-shrink: 0; }
.ag { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); }
.ag i { font-style: normal; } .ag.claude i { color: #d97757; } .ag.codex i { color: #3f8a6f; } .ag.opencode i { color: #6f6a8a; }
.mbot { display: block; overflow: visible; }
.mbot .eye { animation: sweep 2.8s ease-in-out infinite alternate; }
.mbot.scan .eye { animation-duration: .6s; }
@keyframes sweep { from { transform: translateX(-27px); } to { transform: translateX(27px); } }
.mbot .glint { animation: glint 5s ease-in-out infinite; }
@keyframes glint { 0%, 70% { transform: translateX(0); } 85% { transform: translateX(46px); opacity: 0; } 86%, 100% { transform: translateX(0); opacity: 1; } }
.toast { position: absolute; z-index: 40; left: 50%; bottom: 24px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 18px 0 8px; border-radius: 99px; background: var(--ink); color: #fff; font-size: 13px; white-space: nowrap; transform: translateX(-50%); }
.toast .mbot { border-radius: 8px; }
.wipe { position: absolute; inset: 0; z-index: 60; background: #fff; pointer-events: none; }

/* ============ 1. film ============ */
.film { background: #0c0b0b; color: #f1ece6; }
.film canvas { position: absolute; inset: 0; width: 1180px; height: 740px; }
.film .line { position: absolute; left: 50%; top: 596px; width: 900px; margin-left: -450px; text-align: center; font-size: 25px; line-height: 1.32; letter-spacing: -.012em; }
.film .line .g { color: #8f8882; }
.film .slate { position: absolute; left: 26px; bottom: 24px; font: 10.5px var(--m); letter-spacing: .08em; text-transform: uppercase; color: #5f5955; }
.film .skip { position: absolute; right: 26px; bottom: 20px; font: 11px var(--m); color: #8f8882; height: 26px; padding: 0 12px; border-radius: 99px; box-shadow: inset 0 0 0 1px #2a2726; }
.film .skip:hover { color: #fff; }
.film .prog { position: absolute; left: 50%; bottom: 31px; width: 140px; margin-left: -70px; height: 2px; border-radius: 2px; background: #252220; overflow: hidden; }
.film .prog b { display: block; height: 100%; width: 0; background: #f1ece6; }
.film .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

/* ============ 2. scan: the storage-scanner component, rebuilt ============ */
.scanS { background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.scanS .above { display: flex; align-items: center; gap: 9px; margin-bottom: 18px; color: var(--ink-3); font-size: 13px; }
.scanS .above .mbot { border-radius: 6px; }
.dev { width: 840px; border-radius: 26px; background: #18181a; color: #f4f4f5; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 30px 60px -40px rgba(0,0,0,.45); overflow: hidden; }
.dev .in { padding: 30px 32px 26px; }
.dev .h1 { display: flex; align-items: baseline; gap: 10px; }
.dev .h1 .big { font-size: 38px; font-weight: 500; letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.dev .h1 .of { font-size: 18px; color: #8b8b92; letter-spacing: -.01em; }
.dev .h1 .sp { flex: 1; }
.dev .re { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: #6d6d74; transition: color .3s; }
.dev .re svg { width: 15px; height: 15px; }
.dev.done .re { color: #b4b4ba; } .dev.done .re:hover { color: #fff; }
.dev .h2 { margin-top: 12px; display: flex; align-items: center; gap: 12px; height: 20px; font-size: 14.5px; color: #e8e8ea; }
.dev .h2 .p { font: 13px var(--m); color: #77777e; white-space: nowrap; }
.dev .h2 .dot { width: 9px; height: 9px; border-radius: 3px; }
.dev .bar { position: relative; margin-top: 24px; height: 118px; }
.dev .bar canvas { width: 776px; height: 118px; display: block; }
.dev .lg { margin-top: 26px; display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 36px; row-gap: 4px; }
.dev .lg div { display: flex; align-items: center; gap: 11px; height: 34px; padding: 0 8px; margin: 0 -8px; border-radius: 9px; font-size: 15px; color: #ececee; cursor: default; transition: background .2s, opacity .3s; }
.dev.done .lg div:hover { background: #222225; }
.dev .lg .ic { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 22%, #18181a); }
.dev .lg .ic img { width: 12px; height: 12px; }
.dev .lg .ic i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.dev .lg em { margin-left: auto; font-style: normal; font-size: 14.5px; color: #8b8b92; font-variant-numeric: tabular-nums; }
.dev .lg div.dim { opacity: .32; }
.dev .ft { display: flex; align-items: center; gap: 11px; height: 66px; padding: 0 22px 0 32px; border-top: 1px solid #262629; font-size: 14.5px; color: #9a9aa1; }
.dev .ft .spin { width: 16px; height: 16px; animation: rot 1s steps(8) infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.dev .ft .okk { width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; background: #1f3b2b; color: #4ade80; }
.dev .ft .okk svg { width: 10px; height: 10px; }
.dev .ft b { color: #f4f4f5; font-weight: 500; }
.dev .ft .sp { flex: 1; }
.dev .ft .gel { --top: #f6f6f6; --base: #dcdcdf; --fg: #111; height: 36px; box-shadow: inset 0 1px 0 #fff, inset 0 -2px 4px rgba(0,0,0,.15); opacity: 0; pointer-events: none; }
.dev.done .ft .gel { opacity: 1; pointer-events: auto; }

/* ============ 3. setup ============ */
.setup { background: #fff; display: flex; flex-direction: column; align-items: center; padding-top: 70px; }
.setup .hd { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.setup .hd .mbot { border-radius: 10px; }
.setup h2 { font-size: 36px; text-align: center; }
.sent { width: 780px; margin-top: 30px; }
.sent .s { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-height: 76px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 22px; letter-spacing: -.015em; }
.sent .s:last-child { border-bottom: 1px solid var(--line); }
.sent .s .t { width: 214px; flex-shrink: 0; }
.setup .go { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 12px; }

/* ============ 4. app ============ */
.app { display: grid; grid-template-columns: 232px 1fr; background: #fff; }
.side { position: relative; padding: 50px 12px 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: #fafaf9; }
.side .brand { display: flex; align-items: center; gap: 9px; padding: 0 8px; font-size: 16px; font-weight: 600; letter-spacing: -.03em; }
.side .brand .mbot { border-radius: 6px; }
.find { display: flex; align-items: center; gap: 8px; height: 34px; margin: 14px 0 8px; padding: 0 11px; border-radius: 11px; background: #fff; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-3); font-size: 13px; }
.find svg { width: 14px; height: 14px; } .find kbd { margin-left: auto; font: 10.5px var(--m); }
.side .h { margin: 16px 9px 6px; font: 10px var(--m); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.nlist { position: relative; }
.nlist .hi { position: absolute; left: 0; right: 0; top: 0; height: 32px; border-radius: 10px; background: #ececea; pointer-events: none; transition: opacity .2s; }
.nl { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 9px; border-radius: 10px; font-size: 13.5px; color: var(--ink-2); width: 100%; text-align: left; transition: color .2s; }
.nl:hover, .nl.on { color: var(--ink); } .nl.on { font-weight: 500; }
.nl svg { width: 15px; height: 15px; color: var(--ink-3); }
.nl .c { margin-left: auto; font: 10.5px var(--m); color: var(--ink-3); }
.nl .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); margin: 0 4px; animation: pulse 1.8s infinite; }
.side .stat { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; }
.side .stat .mbot { border-radius: 7px; }
.side .stat b { display: block; font-size: 13px; font-weight: 500; } .side .stat span { font-size: 11.5px; color: var(--ink-3); }
.main { position: relative; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.top { display: flex; align-items: center; gap: 10px; height: 58px; padding: 0 28px; flex-shrink: 0; }
.top .ti { font-size: 15.5px; font-weight: 600; letter-spacing: -.02em; }
.top .crumb { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-3); } .top .crumb b { color: var(--ink); font-weight: 500; }
.top .sp { flex: 1; }
.scroll { flex: 1; overflow-y: auto; padding: 2px 28px 40px; scrollbar-width: none; }
.back { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-2); transition: background .2s, transform .45s var(--spring); }
.back:hover { background: var(--soft); } .back:active { transform: scale(.9); } .back svg { width: 15px; height: 15px; }

.banner { display: grid; grid-template-columns: 1fr 1.12fr; border-radius: 24px; background: var(--soft); }
.banner .l { padding: 26px 28px 24px; display: flex; flex-direction: column; }
.banner .l .mbot { border-radius: 10px; }
.banner h1 { margin-top: 18px; font-size: 33px; line-height: 1.04; }
.banner h1 .g { color: var(--ink-3); }
.banner .nums { margin-top: auto; padding-top: 24px; display: flex; flex-wrap: wrap; gap: 6px; }
.banner .nums .pill { background: #fff; height: 28px; padding: 0 12px; }
.banner .r { margin: 8px; padding: 16px 16px 8px; border-radius: 18px; background: #fff; box-shadow: 0 0 0 1px var(--line); }
.banner .r .hh { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 10px; }
.cont { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-top: 1px solid var(--line); }
.gl { width: 34px; height: 34px; border-radius: 11px; background: var(--soft); display: grid; place-items: center; font-size: 14px; flex-shrink: 0; position: relative; }
.gl .lv { position: absolute; right: -2px; top: -2px; width: 10px; height: 10px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 2.5px #fff; }
.cont .k { flex: 1; min-width: 0; }
.cont .k b { display: block; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cont .k span { display: flex; align-items: center; gap: 6px; margin-top: 4px; font: 11.5px var(--m); color: var(--ink-3); }
.cont .k span .av { border-radius: 4px; }

.bar2 { display: flex; align-items: center; gap: 12px; margin: 30px 0 14px; }
.bar2 .h2 { font-size: 17px; font-weight: 600; letter-spacing: -.025em; }
.bar2 .sp { flex: 1; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card { position: relative; border-radius: 22px; background: #fff; box-shadow: inset 0 0 0 1px var(--line-2); padding: 20px 20px 18px; display: flex; flex-direction: column; cursor: pointer; transition: box-shadow .25s, transform .5s var(--spring); }
.card:hover { box-shadow: inset 0 0 0 1px #c9c9cc; transform: translateY(-3px); }
.card .t1 { display: flex; align-items: center; gap: 13px; }
.card .t1 .av { border-radius: 13px; }
.card .t1 .k { flex: 1; min-width: 0; }
.card .nm { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; letter-spacing: -.03em; }
.card .nm .lgi { display: inline-flex; gap: 4px; }
.card .pt { margin-top: 3px; font: 12px var(--m); color: var(--ink-3); }
.card .when { font-size: 12.5px; color: var(--ink-3); }
.card .last { display: flex; align-items: center; gap: 9px; margin-top: 16px; padding: 11px 13px; border-radius: 13px; background: var(--soft); font-size: 13.5px; color: var(--ink); min-width: 0; }
.card .last b { font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .last span { font: 11.5px var(--m); color: var(--ink-3); flex-shrink: 0; }
.card .last.none { color: var(--ink-3); }
.card .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.card .act { display: flex; align-items: center; gap: 8px; margin-top: 18px; }
.card .act .sp { flex: 1; }

.ph { display: flex; align-items: center; gap: 18px; padding: 6px 0 22px; border-bottom: 1px solid var(--line); }
.ph .av { border-radius: 18px; }
.ph h1 { font-size: 34px; line-height: 1; }
.ph .pt { margin-top: 7px; font: 12px var(--m); color: var(--ink-3); }
.ph .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.ph .sp { flex: 1; }
.ph .acts { display: flex; gap: 8px; align-self: flex-start; margin-top: 4px; }

  const ed = e.target.closest("[data-ed]"); if (ed) { e.stopPropagation(); const name = ed.closest(".card")?.dataset.p || cur.id, v = ed.dataset.ed; if (["VS Code", "Cursor", "Zed"].includes(v)) { ed_ = v; $$(".edn").forEach(b => (b.textContent = ed_)); $$(".ide").forEach(b => b.classList.toggle("def", b.dataset.ed === ed_)); } $$(".menu.open").forEach(x => x.classList.remove("open")); toast(v === "Finder" ? `Revealed <b>${name}</b> in Finder` : `Opening <b>${name}</b> in ${v}`); return; }
  $$(".menu.open").forEach(x => x.classList.remove("open"));
  if (e.target.closest("[data-copy]")) { toast("License key copied"); return; }
  const op = e.target.closest("[data-open]"); if (op) { e.stopPropagation(); toast(`Opening <b>${op.closest(".card")?.dataset.p || cur.id}</b> in ${ed_}`); return; }
  if (e.target.closest("[data-resume]")) { e.stopPropagation(); toast(`Resumed in <b>${term}</b>, right where you stopped`); return; }
  if (e.target.closest(".seg")) return;
  const v = e.target.closest("[data-v]"); if (v) { show(v.dataset.v); return; }
  const c = e.target.closest(".card"); if (c) { cur = PX.find(p => p.id === c.dataset.p); sel = "All"; show("project"); }
});
document.getElementById("nav").innerHTML = SCREENS.map(([id, n]) => `<button data-v="${id}" aria-checked="${id === (location.hash.slice(1) || "film")}">${n}</button>`).join("");
document.getElementById("themeSeg").innerHTML = `<button data-v="Light" aria-checked="${theme() !== "dark"}">Light</button><button data-v="Dark" aria-checked="${theme() === "dark"}">Dark</button>`;
initSegs(document.querySelector(".nav"));
SEGH.nav = v => show(v);
SEGH.navtheme = v => { document.documentElement.dataset.theme = v === "Dark" ? "dark" : "light"; try { localStorage.setItem("cd-theme", v === "Dark" ? "dark" : "light"); } catch (e) {} if (["film", "scan"].includes(curView)) show(curView); };
function fit() { const k = Math.min((innerWidth - 40) / 1180, (innerHeight - 100) / 740, 1.25); document.getElementById("scaler").style.transform = `translate(-50%,-50%) scale(${k})`; }
addEventListener("resize", fit); fit();
show(location.hash.slice(1) || "film");

</script>
