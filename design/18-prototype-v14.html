<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Codedeck — Prototype v14 · The Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #fff; --soft: #f6f6f5; --soft-2: #efefed; --ink: #0d0d0e; --ink-2: #55555a; --ink-3: #8e8e93; --ink-4: #c4c4c8;
  --line: #ececea; --line-2: #dededb; --dash: #d6d6d2;
  --red: #e45e4d; --red-ink: #b8392a; --live: #2ea56a;
  --f: "Geist", system-ui, sans-serif; --m: "Geist Mono", ui-monospace, monospace;
  --out: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.3,1.35,.5,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: #f2f2f0; font-family: var(--f); color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.mono { font-family: var(--m); }
.meta { font: 10.5px var(--m); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }

/* stage */
.stage { position: fixed; inset: 0 0 64px; }
.scaler { position: absolute; left: 50%; top: 50%; width: 1180px; height: 740px; transform-origin: 50% 50%; }
.win { position: relative; width: 1180px; height: 740px; border-radius: 14px; overflow: hidden; background: var(--bg); box-shadow: 0 0 0 1px rgba(0,0,0,.09); }
.lights { position: absolute; z-index: 50; top: 16px; left: 16px; display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #e2e2df; }
.app .lights i:nth-child(1) { background: #ff5f57; } .app .lights i:nth-child(2) { background: #febc2e; } .app .lights i:nth-child(3) { background: #28c840; }
.scr { position: absolute; inset: 0; }

/* switcher under the window */
.nav { position: fixed; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; }
.nav div { display: flex; gap: 2px; padding: 4px; border-radius: 99px; background: #fff; box-shadow: 0 0 0 1px var(--line-2); }
.nav button { height: 30px; padding: 0 14px; border-radius: 99px; font-size: 12.5px; color: var(--ink-2); }
.nav button.on { background: var(--ink); color: #fff; }
.nav .ver { margin-left: 10px; font: 10.5px var(--m); color: var(--ink-3); align-self: center; padding-right: 10px; }

/* guides: designeer's dashed construction lines */
.guides i { position: absolute; pointer-events: none; }
.gf { inset: 28px; border: 1px dashed var(--dash); border-radius: 4px; }
.gx { left: 28px; right: 28px; top: 50%; border-top: 1px dashed var(--line-2); }
.gy { top: 28px; bottom: 28px; left: 50%; border-left: 1px dashed var(--line-2); }
.corner { position: absolute; z-index: 5; }
.corner.tl { left: 44px; top: 42px; } .corner.tr { right: 196px; top: 42px; } .corner.bl { left: 44px; bottom: 40px; } .corner.br { right: 44px; bottom: 40px; }
.w { display: inline-block; }

/* pills + buttons */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 99px; background: #fff; box-shadow: 0 0 0 1px var(--line-2); font-size: 12.5px; color: var(--ink); white-space: nowrap; transition: background .2s, box-shadow .2s; }
.pill:hover { background: var(--soft); }
.pill.on { background: var(--ink); color: #fff; box-shadow: none; }
.pill .c { font: 10.5px var(--m); color: var(--ink-3); }
.pill.on .c { color: rgba(255,255,255,.6); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 18px; border-radius: 99px; font-size: 13px; font-weight: 500; background: var(--red); color: #fff; transition: transform .4s var(--spring), background .2s; }
.btn:hover { background: #d8503f; } .btn:active { transform: scale(.95); }
.btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 0 0 1px var(--line-2); } .btn.ghost:hover { background: var(--soft); }
.btn.dark { background: var(--ink); } .btn.dark:hover { background: #2a2a2d; }
.btn.sm { height: 26px; padding: 0 11px; font-size: 12px; }
.tog { position: relative; width: 30px; height: 18px; border-radius: 99px; background: var(--soft-2); box-shadow: inset 0 0 0 1px var(--line-2); transition: background .25s; flex-shrink: 0; }
.tog::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px var(--line-2); transition: transform .4s var(--spring); }
.tog[aria-checked="true"] { background: var(--ink); box-shadow: none; } .tog[aria-checked="true"]::after { transform: translateX(12px); box-shadow: none; }
.tog:disabled { opacity: .4; }
.av { display: block; border-radius: 26%; flex-shrink: 0; }
.si { display: block; flex-shrink: 0; }
.ag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }
.ag i { font-style: normal; } .ag.claude i { color: #d97757; } .ag.codex i { color: #3f8a6f; } .ag.opencode i { color: #6f6a8a; }

/* mascot */
.mbot { display: block; overflow: visible; }
.mbot .eye { animation: sweep 2.8s ease-in-out infinite alternate; }
.mbot.scan .eye { animation-duration: .6s; }
.mbot .grill { transform-box: fill-box; transform-origin: center; }
@keyframes sweep { from { transform: translateX(-27px); } to { transform: translateX(27px); } }
.mbot .glint { animation: glint 5s ease-in-out infinite; }
@keyframes glint { 0%, 70% { transform: translateX(0); } 85% { transform: translateX(46px); opacity: 0; } 86%, 100% { transform: translateX(0); opacity: 1; } }

/* ID badge: every project gets one */
.badge { position: relative; width: 236px; height: 344px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 1px var(--line-2); padding: 14px 16px 14px; display: flex; flex-direction: column; color: var(--ink); overflow: hidden; }
.badge .hole { position: absolute; left: 50%; top: 10px; width: 38px; height: 7px; margin-left: -19px; border-radius: 99px; box-shadow: inset 0 0 0 1px var(--line-2); background: var(--soft); }
.badge .bh { display: flex; justify-content: space-between; margin-top: 14px; font: 9px var(--m); letter-spacing: .1em; color: var(--ink-3); }
.badge .ph { position: relative; margin-top: 10px; height: 112px; border-radius: 10px; display: grid; place-items: center; background: radial-gradient(var(--c) 1.1px, transparent 1.5px) 0 0 / 8px 8px, color-mix(in srgb, var(--c) 8%, #fff); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 18%, #fff); }
.badge .ph .av { border-radius: 14px; }
.badge .nm { margin-top: 12px; font-size: 25px; font-weight: 600; letter-spacing: -.045em; line-height: 1; }
.badge .pt { margin-top: 4px; font: 10px var(--m); color: var(--ink-3); }
.badge .fl { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px dashed var(--line-2); }
.badge .fl div { padding: 6px 0 5px; border-bottom: 1px dashed var(--line-2); }
.badge .fl div:nth-child(odd) { padding-right: 8px; } .badge .fl div:nth-child(even) { padding-left: 10px; border-left: 1px dashed var(--line-2); }
.badge .fl span { display: block; font: 8.5px var(--m); letter-spacing: .1em; color: var(--ink-3); }
.badge .fl b { display: block; margin-top: 2px; font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge .bc { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; }
.badge .bars { display: flex; gap: 1.5px; height: 26px; align-items: stretch; }
.badge .bars i { background: var(--ink); }
.badge .no { font: 9px var(--m); color: var(--ink-3); text-align: right; line-height: 1.3; }
.stamp { position: absolute; right: 14px; top: 132px; padding: 5px 9px 4px; border: 1.6px solid var(--red); border-radius: 6px; color: var(--red); font: 600 11px var(--m); letter-spacing: .12em; transform: rotate(-11deg); opacity: 0; text-align: center; line-height: 1.15; background: rgba(255,255,255,.8); }
.stamp small { display: block; font-size: 7.5px; letter-spacing: .08em; font-weight: 500; }
.badge.sm { width: 104px; height: 152px; border-radius: 9px; padding: 7px 8px; }
.badge.sm .hole { top: 5px; width: 18px; height: 4px; margin-left: -9px; }
.badge.sm .ph { margin-top: 12px; height: 54px; border-radius: 6px; background-size: 6px 6px, auto; }
.badge.sm .ph .av { border-radius: 8px; }
.badge.sm .nm { font-size: 12.5px; margin-top: 7px; letter-spacing: -.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge.sm .pt { font-size: 7px; }
.badge.sm .bars { height: 12px; gap: 1px; }
.badge.sm .no { font-size: 6.5px; }

/* ---------------- Intro ---------------- */
.intro { background: #fff; overflow: hidden; }
.ihead { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-size: 58px; font-weight: 500; letter-spacing: -.055em; line-height: 1; z-index: 4; pointer-events: none; }
.ihead .g { color: var(--ink-4); }
.icap { position: absolute; left: 0; right: 0; bottom: 92px; text-align: center; font-size: 22px; font-weight: 500; letter-spacing: -.04em; z-index: 4; }
.fold { position: absolute; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 10px; border-radius: 10px; background: #fff; box-shadow: 0 0 0 1px var(--line-2); font: 11.5px var(--m); color: var(--ink-2); white-space: nowrap; }
.fold svg { color: var(--ink-3); }
.imat { position: absolute; left: 50%; top: 50%; display: grid; grid-template-columns: repeat(40, 9px); gap: 5px; transform: translate(-50%, -50%); }
.imat i { width: 9px; height: 9px; border-radius: 50%; background: var(--soft-2); }
.ibadge { position: absolute; left: 50%; top: 50%; margin: -172px 0 0 -118px; z-index: 3; }
.ifan .badge { position: absolute; left: 50%; top: 50%; margin: -172px 0 0 -118px; transform-origin: 50% 120%; }
.ilock { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 16px; z-index: 6; opacity: 0; }
.ilock .wm { display: flex; align-items: center; gap: 14px; font-size: 64px; font-weight: 600; letter-spacing: -.065em; }
.ilock .wm .mbot { border-radius: 14px; }
.skip { position: absolute; z-index: 20; right: 40px; top: 36px; }
.iprog { position: absolute; z-index: 20; left: 28px; right: 28px; bottom: 28px; height: 2px; }
.iprog b { display: block; height: 100%; width: 0; background: var(--red); }

/* ---------------- Scan ---------------- */
.scan { background: #fff; overflow: hidden; }
.shead { position: absolute; left: 0; right: 0; top: 52px; text-align: center; }
.shead h2 { margin-top: 8px; font-size: 32px; font-weight: 500; letter-spacing: -.05em; }
.dev { position: absolute; left: 50%; top: 140px; width: 760px; margin-left: -380px; padding: 20px 22px 18px; border-radius: 20px; background: #111113; color: #f4f4f2; }
.dev .dt { display: flex; align-items: flex-end; gap: 14px; }
.dev .dt b { font-size: 34px; font-weight: 500; letter-spacing: -.05em; line-height: .9; font-variant-numeric: tabular-nums; }
.dev .dt .u { font-size: 14px; color: #8b8b90; margin-bottom: 2px; }
.dev .dt .sp { flex: 1; }
.dev .dt .r { font: 11px var(--m); color: #8b8b90; margin-bottom: 3px; }
.dev .chip { height: 26px; padding: 0 11px; border-radius: 8px; background: #1d1d20; box-shadow: inset 0 0 0 1px #2a2a2e; font-size: 12px; color: #cfcfd2; display: inline-flex; align-items: center; gap: 6px; }
.led { margin-top: 16px; padding: 10px; border-radius: 12px; background: #0a0a0b; box-shadow: inset 0 0 0 1px #222226; display: grid; grid-template-columns: repeat(56, 1fr); gap: 3.5px; }
.led i { aspect-ratio: 1; border-radius: 2.5px; background: #1b1b1e; transition: background .2s, box-shadow .3s; }
.legend { margin-top: 14px; display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 26px; row-gap: 7px; }
.legend div { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #d9d9dc; }
.legend .sw { width: 9px; height: 9px; border-radius: 2.5px; }
.legend em { margin-left: auto; font: 11px var(--m); font-style: normal; color: #8b8b90; font-variant-numeric: tabular-nums; }
.tick { margin-top: 12px; padding-top: 11px; border-top: 1px solid #222226; font: 11px var(--m); color: #6f6f75; display: flex; justify-content: space-between; }
.trays { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; padding: 0 64px; z-index: 4; }
.tray { width: 300px; height: 92px; border-radius: 16px 16px 0 0; background: var(--soft); box-shadow: inset 0 0 0 1px var(--line-2); padding: 15px 18px; display: flex; justify-content: space-between; transform-origin: 50% 100%; }
.tray b { font: 500 12.5px var(--m); } .tray em { font: 11px var(--m); color: var(--ink-3); font-style: normal; }
.tray .slot { position: absolute; left: 18px; right: 18px; top: 42px; height: 3px; border-radius: 3px; background: var(--line-2); }
.pile { position: absolute; left: 50%; bottom: 46px; width: 104px; height: 152px; margin-left: -52px; z-index: 3; }
.pile .badge { position: absolute; left: 0; top: 0; }
.pbot { position: absolute; left: 50%; bottom: 210px; margin-left: -20px; z-index: 3; }
.pbot .mbot { border-radius: 10px; }
.fx { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
.fx .badge { position: absolute; }
.streak { position: absolute; width: 2px; margin-left: -1px; border-radius: 2px; transform-origin: 50% 100%; background: linear-gradient(to top, var(--c), transparent); }

/* ---------------- Setup ---------------- */
.setup { display: grid; grid-template-columns: 240px 400px 1fr; background: #fff; }
.col { position: relative; height: 740px; }
.col + .col { border-left: 1px dashed var(--dash); }
.c1 { padding: 64px 18px 20px; display: flex; flex-direction: column; }
.c1 .brand { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 600; letter-spacing: -.04em; padding: 0 8px; }
.c1 .brand .mbot { border-radius: 7px; }
.c1 p { margin: 14px 8px 18px; font-size: 12.5px; line-height: 1.5; color: var(--ink-2); padding-bottom: 16px; border-bottom: 1px dashed var(--dash); }
.stp { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 10px; font-size: 13.5px; color: var(--ink-3); transition: background .2s, color .2s; text-align: left; width: 100%; }
.stp .n { font: 10.5px var(--m); width: 18px; }
.stp .ck { margin-left: auto; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 9px; color: #fff; background: transparent; }
.stp.done { color: var(--ink-2); } .stp.done .ck { background: var(--ink); }
.stp.on { background: var(--soft); color: var(--ink); }
.c2 { padding: 64px 26px 20px; display: flex; flex-direction: column; }
.c2 h2 { margin-top: 10px; font-size: 30px; font-weight: 500; letter-spacing: -.05em; line-height: 1.02; }
.c2 .lead { margin-top: 10px; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.rows { margin-top: 20px; }
.row { display: flex; align-items: center; gap: 11px; min-height: 48px; padding: 8px 0; border-top: 1px dashed var(--line-2); }
.row:last-child { border-bottom: 1px dashed var(--line-2); }
.row .k { flex: 1; min-width: 0; }
.row .k b { display: block; font-size: 13px; font-weight: 500; }
.row .k span { display: block; font: 10.5px var(--m); color: var(--ink-3); margin-top: 2px; }
.row .v { font: 12px var(--m); color: var(--ink-2); }
.row .gl { width: 28px; height: 28px; border-radius: 8px; background: var(--soft); display: grid; place-items: center; flex-shrink: 0; color: var(--ink-3); }
.row.add { color: var(--ink-3); font-size: 13px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.c2 .foot { margin-top: auto; display: flex; gap: 8px; justify-content: flex-end; padding-top: 16px; }
.c3 { background: var(--soft); display: grid; place-items: center; overflow: hidden; }
.c3::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--line-2) 1px, transparent 1px), linear-gradient(90deg, var(--line-2) 1px, transparent 1px); background-size: 40px 40px; opacity: .5; }
.c3 .badge { transform: rotate(-3deg); }
.c3 .note { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; }

/* ---------------- App ---------------- */
.app { display: grid; grid-template-columns: 236px 1fr; background: #fff; }
.side { position: relative; padding: 52px 14px 14px; border-right: 1px dashed var(--dash); display: flex; flex-direction: column; }
.side .brand { display: flex; align-items: center; gap: 9px; padding: 0 8px; font-size: 17px; font-weight: 600; letter-spacing: -.045em; }
.side .brand .mbot { border-radius: 7px; }
.side .desc { margin: 12px 8px 0; padding-bottom: 14px; border-bottom: 1px dashed var(--dash); font-size: 12px; line-height: 1.5; color: var(--ink-2); }
.side .h { margin: 16px 8px 6px; font-size: 11.5px; color: var(--ink-3); font-weight: 500; }
.nl { display: flex; align-items: center; gap: 10px; height: 31px; padding: 0 8px; border-radius: 9px; font-size: 13px; color: var(--ink-2); width: 100%; text-align: left; transition: background .15s; }
.nl:hover { background: var(--soft); }
.nl.on { background: var(--soft); color: var(--ink); font-weight: 500; }
.nl svg { width: 15px; height: 15px; color: var(--ink-3); }
.nl .c { margin-left: auto; font: 10.5px var(--m); color: var(--ink-3); }
.nl .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: pulse 1.8s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.side .card { margin-top: auto; padding: 12px; border-radius: 14px; background: #fff; box-shadow: 0 0 0 1px var(--line-2); display: flex; flex-direction: column; gap: 8px; }
.side .card .t { display: flex; align-items: center; gap: 9px; }
.side .card .t .mbot { border-radius: 7px; }
.side .card b { font-size: 13px; font-weight: 600; letter-spacing: -.02em; } .side .card span { display: block; font-size: 11px; color: var(--ink-3); }
.side .card p { font-size: 12px; line-height: 1.45; color: var(--ink-2); }
.main { position: relative; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.top { display: flex; align-items: center; gap: 6px; height: 56px; padding: 0 20px; border-bottom: 1px dashed var(--dash); flex-shrink: 0; }
.top .sp { flex: 1; }
.search { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 99px; box-shadow: 0 0 0 1px var(--line-2); font-size: 12.5px; color: var(--ink-3); width: 210px; }
.search kbd { margin-left: auto; font: 10.5px var(--m); }
.scroll { flex: 1; overflow-y: auto; padding: 0 20px 30px; scrollbar-width: none; }
.hero { text-align: center; padding: 38px 0 28px; }
.hero h1 { font-size: 30px; font-weight: 500; letter-spacing: -.05em; line-height: 1.1; }
.hero h1 .g { color: var(--ink-3); }
.hero p { margin: 10px auto 0; max-width: 470px; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tile { text-align: left; border-radius: 18px; background: #fff; box-shadow: 0 0 0 1px var(--line-2); overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .2s, transform .45s var(--spring); }
.tile:hover { box-shadow: 0 0 0 1px var(--ink-4); transform: translateY(-2px); }
.tile .pv { position: relative; height: 112px; background: var(--soft); display: flex; align-items: center; padding: 0 16px; gap: 14px; }
.tile .pv .av { border-radius: 12px; }
.fp { display: grid; grid-template-columns: repeat(14, 6px); gap: 4px; margin-left: auto; }
.fp i { width: 6px; height: 6px; border-radius: 50%; }
.tile .st { position: absolute; top: 10px; right: 12px; }
.live { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 99px; background: #fff; box-shadow: 0 0 0 1px var(--line-2); font: 10.5px var(--m); color: var(--ink-2); }
.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--live); animation: pulse 1.8s infinite; }
.agt { position: absolute; left: 16px; bottom: 9px; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px 0 7px; border-radius: 7px; background: var(--ink); color: #fff; font: 10.5px var(--m); white-space: nowrap; }
.agt i { font-style: normal; color: #ff9a7a; }
.tile .bd { padding: 13px 16px 14px; }
.tile .nm { font-size: 16px; font-weight: 600; letter-spacing: -.035em; }
.tile .pt { font: 10.5px var(--m); color: var(--ink-3); margin-top: 2px; }
.kv { margin-top: 11px; }
.kv div { display: flex; align-items: center; gap: 10px; height: 27px; border-top: 1px dashed var(--line-2); font-size: 12px; }
.kv span { color: var(--ink-3); width: 66px; flex-shrink: 0; }
.kv b { font-weight: 400; color: var(--ink); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv em { font: 10.5px var(--m); color: var(--ink-3); font-style: normal; }
.kv .chg { font: 10.5px var(--m); color: #a0662a; }
.cm { display: flex; align-items: flex-end; gap: 2px; height: 13px; }
.cm i { width: 3px; border-radius: 1px; background: var(--line-2); } .cm i.on { background: var(--ink); }

/* project detail (designeer find page) */
.pd { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
.pd .l { padding: 20px 22px; border-right: 1px dashed var(--dash); overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; }

.info { margin-top: 14px; }

.info div:last-child { border-bottom: 1px dashed var(--line-2); }
.info span { color: var(--ink-3); flex: 1; }

.sw3 { display: flex; } .sw3 i { width: 15px; height: 15px; border-radius: 50%; box-shadow: 0 0 0 2px #fff; margin-left: -4px; }
.pd .sh { margin: 18px 0 8px; font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
.ses { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 11px; box-shadow: 0 0 0 1px var(--line-2); margin-bottom: 6px; font-size: 12.5px; }
.ses .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ses em { font: 10.5px var(--m); color: var(--ink-3); font-style: normal; }
.pd .act { margin-top: auto; padding-top: 14px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
.pd .r { position: relative; background: var(--soft); display: grid; place-items: center; overflow: hidden; }
.pd .r::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--line-2) 1px, transparent 1px), linear-gradient(90deg, var(--line-2) 1px, transparent 1px); background-size: 40px 40px; opacity: .5; }
.pd .r .badge { transform: scale(1.12) rotate(-2deg); }

      <div class="tags">${langsOf(p).slice(0, 3).map(l => `<span class="tag">${si(l, 11)}${l}</span>`).join("")}</div></div></button>`;

function home() {
  const fl = ["All", "Rust", "TypeScript", "Go", "Python"], list = filt === "All" ? PX : PX.filter(p => langsOf(p).includes(filt));
  return shell(topbar(`${fl.map(f => `<button class="pill ${f === filt ? "on" : ""}" data-f="${f}">${f}${f === "All" ? "" : ` <span class="c">${PX.filter(p => langsOf(p).includes(f)).length}</span>`}</button>`).join("")}<button class="pill">+3 more ▾</button>`) +
    `<div class="scroll"><div class="hero"><span class="meta">${DATE}</span><h1 style="margin-top:10px">${PX.length} projects, ${NC} conversations.<br><span class="g">One is running right now.</span></h1>
      <p>Everything you've built on this Mac, read from git and your agents' own history. Indexed locally.</p></div>
    <div class="grid">${list.map(tile).join("")}</div></div>`);
}
function project() {
  const p = cur, by = Object.keys(AG).map(a => [a, p.s.filter(x => x[0] === a).length]).filter(x => x[1]);
  const loc = (hash(p.id) % 90 + 4) * 1000, size = ((hash(p.id + "s") % 900) / 10 + 2).toFixed(1);
  return shell(topbar(`<button class="pill" data-v="home">← Projects</button><span class="meta" style="margin-left:8px">~/codes/${p.id}</span>`) + `<div class="pd">
    <div class="l"><div class="own">${bot(p.id, 34)}<div><b>${p.id}</b><span>~/codes/${p.id}</span></div><span class="sp"></span><span class="ib">${I.folder}</span><span class="ib">${I.term}</span></div>
      <p class="lead">Last commit <b style="font-weight:500;color:var(--ink)">“${p.commit}”</b>, ${p.cAgo} ago on <span class="mono">${p.branch}</span>.</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${langsOf(p).map(l => `<span class="tag">${si(l, 11)}${l}</span>`).join("")}</div>
      <div class="info"><div><span>Branch</span><b>${p.branch}</b></div><div><span>Uncommitted</span><b>${p.dirty ? p.dirty + " files" : "clean"}</b></div><div><span>Lines of code</span><b>${loc.toLocaleString()}</b></div><div><span>On disk</span><b>${size} MB</b></div>
        <div><span>Conversations</span><b>${by.map(([a, n]) => `${AG[a][0]} ${n}`).join("  ") || "—"}</b></div><div><span>Languages</span><span class="sw3" style="flex:0">${p.lang.map(([l]) => `<i style="background:${LC[l] || "#bbb"}"></i>`).join("")}</span></div></div>
      <span class="sh">Conversations</span>${p.s.map(([a, t, m, ago]) => `<div class="ses">${ag(a, false)}<span class="t">${t}</span><em>${ago}</em></div>`).join("") || `<p class="mono" style="font-size:11px;color:var(--ink-3)">No conversations yet.</p>`}
      <div class="act"><button class="btn ghost" data-resume>Resume ↺</button><button class="btn">Open in ${ed_} ↗</button></div></div>
    <div class="r"><span class="rl meta">Project card</span>${badge(p, "", PX.indexOf(p) + 1)}</div></div>`);
}
function sessions() {
  const cols = [["Running", ALL.filter(x => x.p.live && x.d === 0).slice(0, 1)], ["Today", ALL.filter(x => x.d === 0 && !(x.p.live && x === ALL[0])).slice(0, 4)], ["Earlier", ALL.filter(x => x.d > 0).slice(0, 5)]];
  return shell(topbar(`<span style="font-size:14px;font-weight:600;letter-spacing:-.02em">Sessions</span><span class="meta" style="margin-left:10px">${ALL.length} across ${P.length} projects</span>`) + `<div class="scroll"><div class="board">${cols.map(([n, xs]) => `<div class="bcol"><div class="bh">${n === "Running" ? '<span class="live" style="box-shadow:none;background:none;padding:0;height:auto"><i></i></span>' : ""}${n}<span class="c">${xs.length}</span></div>
    ${xs.map(x => `<div class="sc"><div class="h1">${bot(x.p.id, 16)}${x.p.id}<em>${x.ago}</em></div><div class="tt">${x.t}</div><div class="ln">› ${x.last}</div>
      <div class="f2">${ag(x.a)}<span class="m">${x.m} msgs</span><span class="sp"></span><button class="btn dark sm" data-resume>Resume</button></div></div>`).join("")}</div>`).join("")}</div></div>`);
}

/* ---------- router ---------- */
const SCREENS = [["intro", "Intro"], ["scan", "Scan"], ["setup", "Setup"], ["home", "Home"], ["project", "Project"], ["sessions", "Sessions"]];
function show(id, fade) {
  clearAll(); view = id;
  const html = id === "intro" ? intro() : id === "scan" ? scan() : id === "setup" ? setup() : id === "home" ? home() : id === "project" ? project() : sessions();
  const paint = () => {
    win.innerHTML = html + (["intro", "scan", "setup"].includes(id) ? '<div class="lights"><i></i><i></i><i></i></div>' : "");
    if (id === "intro") startIntro(); if (id === "scan") startScan(); if (id === "setup") startSetup();
    if (["home", "project", "sessions"].includes(id)) { $$(".tile, .sc, .info > div, .ses, .pd .r .badge").forEach((el, i) => A(el, [{ opacity: 0, transform: "translateY(12px)" }, { opacity: 1, transform: el.matches(".badge") ? "scale(1.12) rotate(-2deg)" : "none" }], { duration: 600, delay: 60 + i * 40 })); }
    document.querySelectorAll("#nav button[data-s]").forEach(b => b.classList.toggle("on", b.dataset.s === (id === "project" ? "project" : id)));
  };
  if (fade && win.firstChild) { const w = document.createElement("div"); w.className = "wipe"; win.appendChild(w); A(w, [{ opacity: 0 }, { opacity: 1 }], { duration: 380 }).onfinish = paint; } else paint();
}
win.addEventListener("click", e => {
  const f = e.target.closest("[data-f]"); if (f) { filt = f.dataset.f; show("home"); return; }
  const t = e.target.closest(".tile"); if (t) { cur = PX.find(p => p.id === t.dataset.p); show("project"); return; }
  const v = e.target.closest("[data-v]"); if (v) { show(v.dataset.v); return; }
  if (e.target.closest("[data-resume]")) { $(".toast")?.remove(); win.querySelector(".main").insertAdjacentHTML("beforeend", `<div class="toast">${mascot(22)}Opened in <b>${term}</b>, right where you stopped.</div>`); A($(".toast"), [{ opacity: 0, transform: "translate(-50%, 16px) scale(.95)" }, { opacity: 1, transform: "translate(-50%, 0)" }], { duration: 500, easing: "cubic-bezier(.3,1.4,.5,1)" }); later(() => A($(".toast"), [{ opacity: 1 }, { opacity: 0 }], { duration: 300 }), 2600); }
});
document.getElementById("nav").innerHTML = SCREENS.map(([id, n]) => `<button data-s="${id}">${n}</button>`).join("") + `<span class="ver">v14 · the index</span>`;
document.getElementById("nav").onclick = e => { const b = e.target.closest("[data-s]"); if (b) show(b.dataset.s); };
function fit() { const k = Math.min((innerWidth - 40) / 1180, (innerHeight - 100) / 740, 1.25); document.getElementById("scaler").style.transform = `translate(-50%,-50%) scale(${k})`; }
addEventListener("resize", fit); fit();
show("intro");
</script>
