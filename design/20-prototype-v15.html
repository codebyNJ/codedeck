<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Codedeck — Prototype v15</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=Instrument+Sans:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #fff; --soft: #f6f6f4; --soft-2: #eeeeeb; --ink: #111112; --ink-2: #57575c; --ink-3: #8e8e93; --ink-4: #c6c6c9;
  --line: #ececea; --line-2: #e0e0dd; --red: #e45e4d; --live: #2ea56a; --amber: #a3651f;
  --f: "Instrument Sans", system-ui, sans-serif; --s: "Fraunces", Georgia, serif; --m: "Geist Mono", ui-monospace, monospace;
  --sv: "opsz" 144, "SOFT" 100; --spring: cubic-bezier(.3,1.35,.5,1); --out: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: #efefed; font-family: var(--f); color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; font-size: 13px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.mono { font-family: var(--m); }
.ser { font-family: var(--s); font-weight: 400; font-variation-settings: var(--sv); letter-spacing: -.02em; }
.it { font-family: var(--s); font-style: italic; font-weight: 400; font-variation-settings: var(--sv); }
.meta { font: 10.5px var(--m); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.w { display: inline-block; }

.stage { position: fixed; inset: 0 0 64px; }
.scaler { position: absolute; left: 50%; top: 50%; width: 1180px; height: 740px; }
.win { position: relative; width: 1180px; height: 740px; border-radius: 14px; overflow: hidden; background: var(--bg); box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
.lights { position: absolute; z-index: 50; top: 16px; left: 16px; display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #e3e3e0; }
.app .lights i:nth-child(1) { background: #ff5f57; } .app .lights i:nth-child(2) { background: #febc2e; } .app .lights i:nth-child(3) { background: #28c840; }
.scr { position: absolute; inset: 0; }
.nav { position: fixed; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; }
.nav div { display: flex; gap: 2px; padding: 4px; border-radius: 99px; background: #fff; box-shadow: 0 0 0 1px var(--line-2); }
.nav button { height: 30px; padding: 0 14px; border-radius: 99px; font-size: 12.5px; color: var(--ink-2); }
.nav button.on { background: var(--ink); color: #fff; }
.nav .ver { margin-left: 10px; font: 10.5px var(--m); color: var(--ink-3); align-self: center; padding-right: 10px; }

/* shared atoms */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 99px; background: var(--soft); font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
.pill b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.pill svg { width: 12px; height: 12px; }
.pill.warn { background: #fbf1e3; color: var(--amber); } .pill.warn b { color: var(--amber); }
.pill.live { background: #e8f5ee; color: #23784e; } .pill.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--live); animation: pulse 1.8s infinite; }
.pill.out { background: #fff; box-shadow: inset 0 0 0 1px var(--line-2); }
@keyframes pulse { 50% { opacity: .35; } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 13px; border-radius: 99px; font-size: 12.5px; font-weight: 500; background: var(--ink); color: #fff; transition: transform .4s var(--spring), background .2s; white-space: nowrap; }
.btn:hover { background: #2b2b2e; } .btn:active { transform: scale(.95); }
.btn.ghost { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); } .btn.ghost:hover { background: var(--soft); }
.btn.sm { height: 26px; padding: 0 11px; font-size: 12px; }
.btn svg { width: 13px; height: 13px; }
.split { position: relative; display: inline-flex; }
.split .btn:first-child { border-radius: 99px 0 0 99px; padding-right: 10px; }
.split .btn.chev { border-radius: 0 99px 99px 0; padding: 0 9px 0 7px; border-left: 1px solid rgba(255,255,255,.18); }
.menu { position: absolute; z-index: 30; left: 0; top: calc(100% + 6px); min-width: 170px; padding: 5px; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px var(--line-2), 0 18px 40px -18px rgba(0,0,0,.3); display: none; }
.menu.open { display: block; animation: pop .3s var(--spring); }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.97); } }
.menu button { display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 9px; border-radius: 8px; font-size: 12.5px; text-align: left; }
.menu button:hover { background: var(--soft); }
.menu button .k { margin-left: auto; font: 10.5px var(--m); color: var(--ink-3); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.av { display: block; border-radius: 26%; flex-shrink: 0; }
.si { display: block; flex-shrink: 0; }
.ag { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); }
.ag i { font-style: normal; } .ag.claude i { color: #d97757; } .ag.codex i { color: #3f8a6f; } .ag.opencode i { color: #6f6a8a; }
.mbot { display: block; overflow: visible; }
.mbot .eye { animation: sweep 2.8s ease-in-out infinite alternate; }
.mbot.scan .eye { animation-duration: .6s; }
@keyframes sweep { from { transform: translateX(-27px); } to { transform: translateX(27px); } }
.mbot .glint { animation: glint 5s ease-in-out infinite; }
@keyframes glint { 0%, 70% { transform: translateX(0); } 85% { transform: translateX(46px); opacity: 0; } 86%, 100% { transform: translateX(0); opacity: 1; } }
.toast { position: absolute; z-index: 40; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 16px 0 8px; border-radius: 99px; background: var(--ink); color: #fff; font-size: 12.5px; white-space: nowrap; }
.toast .mbot { border-radius: 7px; }
.wipe { position: absolute; inset: 0; z-index: 60; background: #fff; pointer-events: none; }

/* ---------------- 1. Film: ASCII, centered, calm ---------------- */
.film { background: #fff; }
.film canvas { position: absolute; inset: 0; width: 1180px; height: 740px; }
.film .line { position: absolute; left: 0; right: 0; top: 600px; text-align: center; font-size: 27px; line-height: 1.25; color: var(--ink); }
.film .line .g { color: var(--ink-3); }
.film .brand { position: absolute; left: 0; right: 0; top: 46px; text-align: center; }
.film .skip { position: absolute; right: 26px; bottom: 22px; font: 11px var(--m); color: var(--ink-3); }
.film .skip:hover { color: var(--ink); }
.film .prog { position: absolute; left: 50%; bottom: 30px; width: 120px; margin-left: -60px; height: 2px; border-radius: 2px; background: var(--line); overflow: hidden; }
.film .prog b { display: block; height: 100%; width: 0; background: var(--ink); }

/* ---------------- 2. Scan: only the scanner ---------------- */
.scanS { background: #fff; display: flex; flex-direction: column; align-items: center; padding-top: 86px; }
.scanS h2 { margin-top: 10px; font-size: 38px; line-height: 1.05; }
.dev { margin-top: 30px; width: 800px; padding: 24px 26px 18px; border-radius: 24px; background: #121214; color: #f2f2f0; }
.dev .dt { display: flex; align-items: flex-start; }
.dev .dt .big { font-size: 34px; font-weight: 600; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.dev .dt .big span { font-size: 17px; font-weight: 500; color: #8c8c91; letter-spacing: -.01em; }
.dev .dt .sub { margin-top: 7px; font: 11px var(--m); color: #77777d; }
.dev .dt .sp { flex: 1; }
.dev .re { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 7px; border-radius: 10px; background: #1d1d20; box-shadow: inset 0 0 0 1px #2b2b2f; font-size: 12.5px; color: #dcdcde; }
.dev .re .mbot { border-radius: 4px; }
.segbar { margin-top: 22px; height: 96px; display: flex; padding: 8px; border-radius: 14px; background: #0b0b0c; box-shadow: inset 0 0 0 1px #232327; }
.seg { flex: 0 0 0%; min-width: 0; height: 100%; border-radius: 7px; margin-right: 0; border: 0 solid var(--c);
  background: radial-gradient(color-mix(in srgb, var(--c) 95%, #fff) 1.15px, transparent 1.7px) 0 0 / 7px 7px, color-mix(in srgb, var(--c) 20%, #0b0b0c);
  box-shadow: 0 0 14px -2px color-mix(in srgb, var(--c) 70%, transparent), inset 0 0 10px color-mix(in srgb, var(--c) 35%, transparent);
  transition: flex-basis .6s var(--spring), margin .3s, border-width .3s; }
.seg.on { border-width: 1.5px; margin-right: 3px; }
.rest { flex: 1; border-radius: 7px; background: radial-gradient(rgba(255,255,255,.09) 1.1px, transparent 1.6px) 0 0 / 7px 7px; }
.legend { margin-top: 18px; display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 30px; row-gap: 10px; }
.legend div { display: flex; align-items: center; gap: 9px; font-size: 13px; color: #e1e1e3; }
.legend .ic { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 22%, #121214); }
.legend .ic .si { width: 11px !important; height: 11px !important; }
.legend em { margin-left: auto; font: 11.5px var(--m); font-style: normal; color: #8c8c91; font-variant-numeric: tabular-nums; }
.dev .ft { margin-top: 16px; padding-top: 14px; border-top: 1px solid #232327; display: flex; justify-content: space-between; font: 11px var(--m); color: #6e6e74; }
.scanS .after { margin-top: 26px; text-align: center; opacity: 0; }
.scanS .after p { font-size: 22px; } .scanS .after .meta { display: block; margin-top: 10px; }

/* ---------------- 3. Setup: sentences, not cards ---------------- */
.setup { background: #fff; display: flex; flex-direction: column; align-items: center; padding-top: 74px; }
.setup .hd { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.setup .hd .mbot { border-radius: 10px; }
.setup h2 { font-size: 34px; text-align: center; }
.sent { width: 760px; margin-top: 34px; }
.sent .s { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 18px 0; border-top: 1px solid var(--line); font-size: 22px; }
.sent .s:last-child { border-bottom: 1px solid var(--line); }
.sent .s .t { margin-right: 6px; }
.ch { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 99px; font: 500 13.5px var(--f); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-2); transition: background .2s, color .2s, transform .4s var(--spring); }
.ch:hover { background: var(--soft); } .ch:active { transform: scale(.94); }
.ch.on { background: var(--ink); color: #fff; box-shadow: none; }
.ch.mono { font: 12.5px var(--m); }
.ch.off { color: var(--ink-4); box-shadow: inset 0 0 0 1px var(--line); cursor: default; }
.ch .ck { font-size: 11px; opacity: .8; }
.setup .go { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.setup .go .btn { height: 40px; padding: 0 22px; font-size: 14px; }

/* ---------------- 4. App ---------------- */
.app { display: grid; grid-template-columns: 228px 1fr; background: #fff; }
.side { padding: 50px 12px 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: #fbfbfa; }
.side .brand { display: flex; align-items: center; gap: 9px; padding: 0 8px; font-size: 16px; font-weight: 600; letter-spacing: -.03em; }
.side .brand .mbot { border-radius: 6px; }
.find { display: flex; align-items: center; gap: 8px; height: 32px; margin: 14px 0 6px; padding: 0 10px; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-3); font-size: 12.5px; }
.find svg { width: 14px; height: 14px; } .find kbd { margin-left: auto; font: 10.5px var(--m); }
.side .h { margin: 16px 8px 6px; font: 10px var(--m); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.nl { display: flex; align-items: center; gap: 10px; height: 31px; padding: 0 8px; border-radius: 9px; font-size: 13px; color: var(--ink-2); width: 100%; text-align: left; }
.nl:hover { background: var(--soft-2); } .nl.on { background: var(--soft-2); color: var(--ink); font-weight: 500; }
.nl svg { width: 15px; height: 15px; color: var(--ink-3); }
.nl .c { margin-left: auto; font: 10.5px var(--m); color: var(--ink-3); }
.nl .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); margin: 0 4px; animation: pulse 1.8s infinite; }
.side .stat { margin-top: auto; display: flex; align-items: center; gap: 9px; padding: 10px; border-radius: 12px; }
.side .stat .mbot { border-radius: 7px; }
.side .stat b { display: block; font-size: 12.5px; font-weight: 500; } .side .stat span { font-size: 11px; color: var(--ink-3); }
.main { position: relative; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.top { display: flex; align-items: center; gap: 8px; height: 54px; padding: 0 24px; flex-shrink: 0; }
.top .ti { font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
.top .crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); } .top .crumb b { color: var(--ink); font-weight: 500; }
.top .sp { flex: 1; }
.seg2 { display: inline-flex; padding: 3px; border-radius: 99px; background: var(--soft); }
.seg2 button { height: 24px; padding: 0 11px; border-radius: 99px; font-size: 12px; color: var(--ink-3); }
.seg2 button.on { background: #fff; color: var(--ink); box-shadow: 0 0 0 1px var(--line-2); }
.scroll { flex: 1; overflow-y: auto; padding: 0 24px 34px; scrollbar-width: none; }
.back { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-2); }
.back:hover { background: var(--soft); } .back svg { width: 15px; height: 15px; }

/* banner: greeting + numbers + continue, one unified block */
.banner { display: grid; grid-template-columns: 1fr 1.15fr; gap: 0; border-radius: 22px; background: var(--soft); overflow: hidden; }
.banner .l { position: relative; padding: 26px 26px 22px; display: flex; flex-direction: column; }
.banner .l .mbot { border-radius: 10px; }
.banner h1 { margin-top: 16px; font-size: 34px; line-height: 1.04; }
.banner h1 .g { color: var(--ink-3); }
.banner .nums { margin-top: auto; padding-top: 22px; display: flex; flex-wrap: wrap; gap: 6px; }
.banner .nums .pill { background: #fff; height: 26px; padding: 0 11px; font-size: 12px; }
.banner .r { padding: 18px 18px 14px; background: #fff; margin: 8px; border-radius: 16px; box-shadow: 0 0 0 1px var(--line); display: flex; flex-direction: column; }
.banner .r .hh { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 10px; }
.cont { display: flex; align-items: center; gap: 11px; padding: 10px 6px; border-top: 1px solid var(--line); }
.cont .gl { width: 30px; height: 30px; border-radius: 9px; background: var(--soft); display: grid; place-items: center; font-size: 13px; flex-shrink: 0; position: relative; }
.cont .gl .lv { position: absolute; right: -2px; top: -2px; width: 9px; height: 9px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 2px #fff; }
.cont .k { flex: 1; min-width: 0; }
.cont .k b { display: block; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cont .k span { display: flex; align-items: center; gap: 6px; margin-top: 3px; font: 11px var(--m); color: var(--ink-3); }
.cont .k span .av { border-radius: 4px; }

.bar2 { display: flex; align-items: center; gap: 6px; margin: 26px 0 14px; }
.bar2 .h2 { font-size: 15px; font-weight: 600; letter-spacing: -.02em; margin-right: 8px; }
.fl { height: 28px; padding: 0 11px; border-radius: 99px; font-size: 12.5px; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-2); display: inline-flex; align-items: center; gap: 5px; }
.fl:hover { background: var(--soft); } .fl.on { background: var(--ink); color: #fff; box-shadow: none; }
.fl .c { font: 10.5px var(--m); opacity: .55; }

/* project card: only what you need, and the open button lives here */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.card { position: relative; border-radius: 18px; background: #fff; box-shadow: inset 0 0 0 1px var(--line-2); padding: 15px 15px 14px; display: flex; flex-direction: column; gap: 13px; cursor: pointer; transition: box-shadow .2s, transform .45s var(--spring); }
.card:hover { box-shadow: inset 0 0 0 1px var(--ink-4); transform: translateY(-2px); }
.card .t1 { display: flex; align-items: center; gap: 11px; }
.card .t1 .av { border-radius: 11px; }
.card .t1 .k { flex: 1; min-width: 0; }
.card .nm { font-size: 15.5px; font-weight: 600; letter-spacing: -.025em; }
.card .pt { font: 10.5px var(--m); color: var(--ink-3); margin-top: 2px; white-space: nowrap; }
.card .when { font: 10.5px var(--m); color: var(--ink-3); align-self: flex-start; margin-top: 2px; }
.card .pills { display: flex; flex-wrap: wrap; gap: 5px; }
.card .act { display: flex; align-items: center; gap: 6px; margin-top: auto; }
.card .lg { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: -1px; }
.card .act .sp { flex: 1; }
.card .act .ico { width: 26px; height: 26px; padding: 0; }

/* project page */
.ph { display: flex; align-items: center; gap: 16px; padding: 6px 0 20px; border-bottom: 1px solid var(--line); }
.ph .av { border-radius: 16px; }
.ph h1 { font-size: 32px; line-height: 1; }
.ph .pt { margin-top: 6px; font: 11.5px var(--m); color: var(--ink-3); }
.ph .pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.ph .sp { flex: 1; }
.ph .acts { display: flex; gap: 6px; align-self: flex-start; margin-top: 4px; }
.pd { display: grid; grid-template-columns: 1fr 300px; gap: 34px; padding-top: 22px; }
.sec { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.sec .h2 { font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
.sec .sp { flex: 1; }
.grp { margin: 16px 0 4px; }
.srow { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-top: 1px solid var(--line); }
.srow .gl { width: 30px; height: 30px; border-radius: 9px; background: var(--soft); display: grid; place-items: center; font-size: 13px; flex-shrink: 0; position: relative; }
.srow .gl .lv { position: absolute; right: -2px; top: -2px; width: 9px; height: 9px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 2px #fff; }
.srow .k { flex: 1; min-width: 0; }
.srow .k b { display: block; font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .k small { display: block; margin-top: 3px; font: 11px var(--m); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .n { font: 11px var(--m); color: var(--ink-3); width: 66px; text-align: right; }
.srow .btn { opacity: 0; transition: opacity .2s; } .srow:hover .btn, .srow.running .btn { opacity: 1; }
.used .blk { padding: 14px 0; border-top: 1px solid var(--line); }
.used .blk:first-of-type { border-top: 0; padding-top: 4px; }
.used .lb { font: 10px var(--m); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 9px; }
.used .pills { display: flex; flex-wrap: wrap; gap: 5px; }
.used .gitl { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; } .used .gitl b { font-weight: 500; color: var(--ink); }
.heat { display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px; margin-top: 10px; }
.heat i { aspect-ratio: 1; border-radius: 3px; background: var(--soft-2); }
.waf { display: flex; gap: 14px; align-items: center; }
.waf .wg { display: grid; grid-template-columns: repeat(10, 9px); gap: 3px; }
.waf .wg i { width: 9px; height: 9px; border-radius: 2.5px; }
.waf .wl { flex: 1; font-size: 12px; } .waf .wl div { display: flex; align-items: center; gap: 7px; height: 21px; }
.waf .wl .sw { width: 8px; height: 8px; border-radius: 2px; } .waf .wl em { margin-left: auto; font: 11px var(--m); font-style: normal; color: var(--ink-3); }
</style>
</head>
<body>
<div class="stage"><div class="scaler" id="scaler"><div class="win" id="win"></div></div></div>
<div class="nav"><div id="nav"></div></div>
<script>
let icons = "Brand";

      LEG.forEach(L => { const s = $(`.seg[data-l="${L}"]`); s.style.flexBasis = (cnt[L] / PX.length * 100) + "%"; s.classList.toggle("on", cnt[L] > 0); $(`.legend em[data-l="${L}"]`).textContent = cnt[L]; });
      $("#sN").textContent = i + 1; $("#sL").textContent = loc >= 1000 ? (loc / 1000).toFixed(2) + "M" : loc + "k"; $("#sS").textContent = ALL.filter(x => PX.indexOf(x.p) <= i).length;
      $("#sTick").textContent = (i < 19 ? "~/codes/" : "~/Developer/") + p.id; if (i === 19) $("#sH").innerHTML = 'Reading <span class="it">~/Developer</span>';
    }, t); });
  later(() => {
    $("#sT").dataset.d = 1; $("#sT").textContent = "2.4"; $("#sChip").innerHTML = `${mascot(16)}<span>Done</span>`;
    $("#sH").innerHTML = `Found <span class="it">everything.</span>`;
    $$(".seg.on").forEach((s, i) => s.animate([{ filter: "brightness(1)" }, { filter: "brightness(1.6)" }, { filter: "brightness(1)" }], { duration: 600, delay: i * 70 }));
    $("#sSum").innerHTML = `${PX.length} projects, ${ALL.length} conversations, <span class="it">five languages.</span>`;
    A($("#sAfter"), [{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: 800, delay: 300 });
  }, t + 600);
  later(() => show("setup", true), t + 3200);
}

/* ============================================================
   3. Setup: four sentences with choices inside them. No cards.
   ============================================================ */
const setup = () => `<div class="scr setup"><div class="hd">${mascot(40)}<span class="meta">Step 2 of 2 · three quick choices</span><h2 class="ser">Make it <span class="it">yours.</span></h2></div>
  <div class="sent">
    <div class="s"><span class="t">Keep watching</span><button class="ch mono on" data-t>~/codes <span class="ck">19</span></button><button class="ch mono on" data-t>~/Developer <span class="ck">5</span></button><button class="ch mono" data-t>~/Desktop <span class="ck">2</span></button><button class="ch">+ folder</button></div>
    <div class="s"><span class="t">Open projects in</span>${["VS Code", "Cursor", "Zed"].map(x => `<button class="ch ${x === ed_ ? "on" : ""}" data-one="ed">${x}</button>`).join("")}</div>
    <div class="s"><span class="t">Resume conversations in</span>${["Terminal", "iTerm", "Ghostty", "Warp"].map(x => `<button class="ch ${x === term ? "on" : ""}" data-one="term">${x}</button>`).join("")}</div>
    <div class="s"><span class="t">Read history from</span><button class="ch on" data-t><span class="ag claude"><i>✻</i></span>Claude Code <span class="ck">47</span></button><button class="ch on" data-t><span class="ag codex"><i>◎</i></span>Codex <span class="ck">9</span></button><span class="ch off">OpenCode · not installed</span></div>
  </div>
  <div class="go"><button class="btn" id="sgo">Open Codedeck →</button><span class="meta">You can change any of this later in Settings</span></div></div>`;
function startSetup() {
  A($(".setup .hd"), [{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: 800 });
  $$(".sent .s").forEach((s, i) => A(s, [{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: 700, delay: 250 + i * 110 }));
  A($(".setup .go"), [{ opacity: 0 }, { opacity: 1 }], { duration: 700, delay: 750 });
  $(".setup").onclick = e => {
    const tg = e.target.closest("[data-t]"); if (tg) tg.classList.toggle("on");
    const one = e.target.closest("[data-one]"); if (one) { $$(`[data-one="${one.dataset.one}"]`).forEach(b => b.classList.toggle("on", b === one)); if (one.dataset.one === "ed") ed_ = one.textContent; else term = one.textContent; }
  };
  $("#sgo").onclick = () => show("home", true);
}

/* ============================================================
   4. The app
   ============================================================ */
let filt = "All", cur = P[0], sel = "All";
const side = v => `<aside class="side"><div class="brand">${mascot(22)}codedeck</div><div class="find">${I.search}Search<kbd>⌘K</kbd></div>
  ${[["home", "Home", I.home, PX.length], ["sessions", "Sessions", I.clock, ALL.length]].map(([id, n, ic, c]) => `<button class="nl ${v === id ? "on" : ""}" data-v="${id}">${ic}${n}<span class="c">${c}</span></button>`).join("")}
  <button class="nl" data-v="sessions"><span class="dot"></span>Running now<span class="c">1</span></button><button class="nl">${I.loose}Loose sessions<span class="c">3</span></button>
  <span class="h">Folders</span>${[["~/codes", 19], ["~/Developer", 5]].map(([f, c]) => `<button class="nl">${I.folder}<span class="mono" style="font-size:12px">${f}</span><span class="c">${c}</span></button>`).join("")}
  <span class="h">Agents</span>${[["claude", "Claude Code", 8], ["codex", "Codex", 3], ["opencode", "OpenCode", 2]].map(([a, n, c]) => `<button class="nl"><span class="ag ${a}" style="width:15px;justify-content:center"><i>${AG[a][0]}</i></span>${n}<span class="c">${c}</span></button>`).join("")}
  <div class="stat">${mascot(26)}<div><b>All caught up</b><span>2 folders · synced 12s ago</span></div></div></aside>`;
const shell = (v, main) => `<div class="scr app"><div class="lights"><i></i><i></i><i></i></div>${side(v)}<div class="main">${main}</div></div>`;
const openBtn = (sm = true) => `<div class="split"><button class="btn ${sm ? "sm" : ""}" data-open>Open in ${ed_}</button><button class="btn ${sm ? "sm" : ""} chev" data-menu>${CHEV}</button>
  <div class="menu">${["VS Code", "Cursor", "Zed"].map(x => `<button data-ed="${x}">${I.code}${x}${x === ed_ ? '<span class="k">default</span>' : ""}</button>`).join("")}<hr><button data-ed="Finder">${I.folder}Reveal in Finder</button><button data-ed="${term}">${I.term}Open in ${term}</button></div></div>`;
const commits14 = p => { let h = hash(p.id + "c"), n = 0; for (let d = 0; d < 14; d++) { h = (h * 16807) % 2147483647; const v = h % 10; n += d > 9 && /now|h|1d/.test(p.ago) ? 1 + v % 4 : v < 6 ? 0 : v % 3 + 1; } return n; };
function card(p) {
  const last = p.s[0], ls = langsOf(p).slice(0, 2);
  return `<div class="card" data-p="${p.id}">
    <div class="t1">${bot(p.id, 40)}<div class="k"><div class="nm">${p.id}</div><div class="pt">~/codes/${p.id}<span class="lg">${ls.map(l => si(l, 11)).join("")}</span></div></div>${p.live ? '<span class="pill live"><i></i>running</span>' : `<span class="when">${p.ago}</span>`}</div>
    <div class="pills"><span class="pill">${I.branch}${p.branch}</span>${p.dirty ? `<span class="pill warn"><b>${p.dirty}</b> changed</span>` : `<span class="pill">clean</span>`}
      <span class="pill"><b>${p.s.length}</b> ${p.s.length === 1 ? "chat" : "chats"}</span><span class="pill"><b>${commits14(p)}</b> commits</span></div>
    <div class="act">${openBtn()}${last ? `<button class="btn sm ghost" data-resume>${I.term}Resume</button>` : ""}<span class="sp"></span></div></div>`;
}
function home() {
  const recent = ALL.filter((x, i, a) => a.findIndex(y => y.p === x.p) === i).slice(0, 3), fl = ["All", "Rust", "TypeScript", "Go", "Python", "Swift"];
  const list = filt === "All" ? PX : PX.filter(p => langsOf(p).includes(filt)), dirty = PX.reduce((a, p) => a + p.dirty, 0);
  return shell("home", `<div class="top"><span class="ti">Home</span><span class="sp"></span><div class="seg2"><button class="on">Recent</button><button>A–Z</button><button>Most chats</button></div></div>
  <div class="scroll">
    <div class="banner" data-in>
      <div class="l">${mascot(34)}<h1 class="ser">${GREET}.<br><span class="g it">Claude is working in codedeck.</span></h1>
        <div class="nums"><span class="pill"><b>${PX.length}</b> projects</span><span class="pill"><b>${ALL.length}</b> conversations</span><span class="pill live"><i></i><b>1</b> running</span><span class="pill warn"><b>${dirty}</b> uncommitted</span><span class="pill"><b>5</b> languages</span></div></div>
      <div class="r"><div class="hh"><span class="meta">Continue where you left off</span><span class="meta">${recent.length} recent</span></div>
        ${recent.map((x, i) => `<div class="cont"><span class="gl ag ${x.a}"><i>${AG[x.a][0]}</i>${i === 0 ? '<span class="lv"></span>' : ""}</span><div class="k"><b>${x.t}</b><span>${bot(x.p.id, 14)}${x.p.id} · ${x.m} msgs · ${x.ago}</span></div><button class="btn sm ${i ? "ghost" : ""}" data-resume>Resume</button></div>`).join("")}</div></div>
    <div class="bar2"><span class="h2">Projects</span>${fl.map(f => `<button class="fl ${f === filt ? "on" : ""}" data-f="${f}">${f}${f === "All" ? "" : `<span class="c">${PX.filter(p => langsOf(p).includes(f)).length}</span>`}</button>`).join("")}</div>
    <div class="grid">${list.map(card).join("")}</div></div>`);
}
const DAYG = ["Today", "Yesterday", "This week", "Earlier"];
const dayOf = x => x.d === 0 ? 0 : x.d === 1 ? 1 : x.d < 7 ? 2 : 3;
const srow = (x, withP) => `<div class="srow ${x.p.live && x === ALL[0] ? "running" : ""}"><span class="gl ag ${x.a}"><i>${AG[x.a][0]}</i>${x.p.live && x === ALL[0] ? '<span class="lv"></span>' : ""}</span>
  <div class="k"><b>${x.t}</b><small>› ${x.last}</small></div>${withP ? `<span class="pill">${bot(x.p.id, 12)}${x.p.id}</span>` : ""}<span class="n">${x.m} msgs</span><span class="n" style="width:34px">${x.ago}</span><button class="btn sm" data-resume>Resume</button></div>`;
function project() {
  const p = cur, ss = ALL.filter(x => x.p === p && (sel === "All" || AG[x.a][1] === sel)), by = Object.keys(AG).map(a => [a, p.s.filter(x => x[0] === a)]).filter(x => x[1].length);
  let h = hash(p.id); const heat = Array.from({ length: 45 }, () => { h = (h * 16807) % 2147483647; const v = h % 10; return v < 5 ? 0 : v < 8 ? .25 : v < 9 ? .5 : .9; });
  const waf = p.lang.flatMap(([l, v]) => Array(v).fill(LC[l] || "#bbb"));
  const tools = [...new Set([...(p.files || []).map(f => ({ "Cargo.toml": "Cargo", "package.json": "npm", "tauri.conf.json": "Tauri", "go.mod": "Go modules", "pyproject.toml": "uv", "uv.lock": "uv", "Package.swift": "SwiftPM", "docker-compose.yml": "Docker", ".github/": "GitHub Actions", "next.config.ts": "Next.js", "vite.config.ts": "Vite" }[f] || null)).filter(Boolean), ...p.tags])];
  return shell("home", `<div class="top"><button class="back" data-v="home">${I.back}</button><div class="crumb">Home <span>/</span> <b>${p.id}</b></div></div>
  <div class="scroll"><div class="ph" data-in>${bot(p.id, 64)}<div><h1 class="ser">${p.id}</h1><div class="pt">~/codes/${p.id}</div>
      <div class="pills">${p.live ? '<span class="pill live"><i></i>running</span>' : ""}<span class="pill">${I.branch}${p.branch}</span>${p.dirty ? `<span class="pill warn"><b>${p.dirty}</b> changed</span>` : `<span class="pill">clean</span>`}<span class="pill"><b>${lines(p)}k</b> lines</span><span class="pill"><b>${commits14(p)}</b> commits · 14d</span>${langsOf(p).map(l => `<span class="pill">${si(l, 11)}${l}</span>`).join("")}</div></div>
    <span class="sp"></span><div class="acts">${openBtn(false)}<button class="btn ghost" data-ed="${term}">${I.term}${term}</button><button class="btn ghost" data-ed="Finder">${I.folder}Finder</button></div></div>
  <div class="pd"><div>
    <div class="sec" data-in><span class="h2">Sessions</span><span class="meta">${p.s.length} here</span><span class="sp"></span><div class="seg2">${["All", ...by.map(([a]) => AG[a][1])].map(x => `<button class="${x === sel ? "on" : ""}" data-sel="${x}">${x}</button>`).join("")}</div></div>
    ${ss.length ? DAYG.map((g, gi) => { const xs = ss.filter(x => dayOf(x) === gi); return xs.length ? `<div class="grp meta">${gi === 0 && p.live ? "Running now · today" : g}</div>${xs.map(x => srow(x)).join("")}` : ""; }).join("") : `<div style="padding:40px 0;text-align:center;color:var(--ink-3)">${mascot(40)}<p style="margin-top:12px">No agent sessions in this project yet.</p></div>`}
  </div>
  <div class="used" data-in><div class="sec"><span class="h2">Used here</span></div>
    <div class="blk"><div class="lb">Agents</div><div class="pills">${by.map(([a, xs]) => `<span class="pill"><span class="ag ${a}"><i>${AG[a][0]}</i></span>${AG[a][1]} · <b>${xs.length}</b> · ${xs.reduce((s, x) => s + x[2], 0)} msgs</span>`).join("") || '<span class="pill">none yet</span>'}</div></div>
    <div class="blk"><div class="lb">Opened in</div><div class="pills"><span class="pill">${I.code}${ed_} · <b>${hash(p.id) % 20 + 4}×</b></span><span class="pill">${I.code}VS Code · <b>${hash(p.id) % 4 + 1}×</b></span><span class="pill">${I.term}${term} · <b>${hash(p.id) % 9 + 2}×</b></span></div></div>
    <div class="blk"><div class="lb">Tooling detected</div><div class="pills">${tools.map(t => `<span class="pill out">${t}</span>`).join("") || '<span class="pill">—</span>'}</div></div>
    <div class="blk"><div class="lb">Git</div><div class="gitl">Last commit <b>“${p.commit}”</b>, ${p.cAgo} ago on <span class="mono">${p.branch}</span>.</div><div class="heat">${heat.map(v => `<i style="${v ? `background:rgba(17,17,18,${v})` : ""}"></i>`).join("")}</div></div>
    <div class="blk"><div class="lb">Languages</div><div class="waf"><div class="wg">${Array.from({ length: 100 }, (_, i) => `<i style="background:${waf[(i % 10) * 10 + (i / 10 | 0)] || "#eee"}"></i>`).join("")}</div><div class="wl">${p.lang.map(([l, v]) => `<div><span class="sw" style="background:${LC[l] || "#bbb"}"></span>${l}<em>${v}%</em></div>`).join("")}</div></div></div>
  </div></div></div>`);
}
function sessions() {
  return shell("sessions", `<div class="top"><span class="ti">Sessions</span><span class="meta" style="margin-left:6px">${ALL.length} across ${P.length} projects</span></div>
  <div class="scroll">${DAYG.map((g, gi) => { const xs = ALL.filter(x => dayOf(x) === gi); return xs.length ? `<div class="grp meta">${g}</div>${xs.map(x => srow(x, true)).join("")}` : ""; }).join("")}</div>`);
}

/* ---------- router ---------- */
const SCREENS = [["film", "Film"], ["scan", "Scan"], ["setup", "Setup"], ["home", "Home"], ["project", "Project"], ["sessions", "Sessions"]];
let view = "film";
function show(id, fade) {
  clearAll(); view = id;
  const html = { film, scan, setup, home, project, sessions }[id]();
  const paint = () => {
    win.innerHTML = html + (["film", "scan", "setup"].includes(id) ? '<div class="lights"><i></i><i></i><i></i></div>' : "");
    if (id === "film") startFilm(); if (id === "scan") startScan(); if (id === "setup") startSetup();
    $$("[data-in], .card, .srow").forEach((el, i) => A(el, [{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: 600, delay: Math.min(i, 14) * 45 }));
    document.querySelectorAll("#nav [data-s]").forEach(b => b.classList.toggle("on", b.dataset.s === id));
  };
  if (fade && win.firstChild) { const w = document.createElement("div"); w.className = "wipe"; win.appendChild(w); A(w, [{ opacity: 0 }, { opacity: 1 }], { duration: 420 }).onfinish = paint; } else paint();
}
const toast = html => { $(".toast")?.remove(); win.querySelector(".main")?.insertAdjacentHTML("beforeend", `<div class="toast">${mascot(22)}${html}</div>`); const t = $(".toast"); if (!t) return; A(t, [{ opacity: 0, transform: "translate(-50%, 14px)" }, { opacity: 1, transform: "translate(-50%, 0)" }], { duration: 450, easing: "cubic-bezier(.3,1.4,.5,1)" }); later(() => A(t, [{ opacity: 1 }, { opacity: 0 }], { duration: 300 }), 2400); };
win.addEventListener("click", e => {
  const m = e.target.closest("[data-menu]"); if (m) { const mn = m.parentElement.querySelector(".menu"), open = mn.classList.contains("open"); $$(".menu.open").forEach(x => x.classList.remove("open")); if (!open) mn.classList.add("open"); return; }
  const ed = e.target.closest("[data-ed]"); if (ed) { const name = ed.closest(".card")?.dataset.p || cur.id; if (["VS Code", "Cursor", "Zed"].includes(ed.dataset.ed)) ed_ = ed.dataset.ed; $$(".menu.open").forEach(x => x.classList.remove("open")); toast(`Opening <b>${name}</b> in ${ed.dataset.ed}`); $$("[data-open]").forEach(b => (b.textContent = "Open in " + ed_)); return; }
  $$(".menu.open").forEach(x => x.classList.remove("open"));
  const op = e.target.closest("[data-open]"); if (op) { toast(`Opening <b>${op.closest(".card")?.dataset.p || cur.id}</b> in ${ed_}`); return; }
  if (e.target.closest("[data-resume]")) { toast(`Resumed in <b>${term}</b>, right where you stopped`); return; }
  const f = e.target.closest("[data-f]"); if (f) { filt = f.dataset.f; show("home"); return; }
  const s = e.target.closest("[data-sel]"); if (s) { sel = s.dataset.sel; show("project"); return; }
  const v = e.target.closest("[data-v]"); if (v) { show(v.dataset.v); return; }
  const c = e.target.closest(".card"); if (c) { cur = PX.find(p => p.id === c.dataset.p); sel = "All"; show("project"); }
});
document.getElementById("nav").innerHTML = SCREENS.map(([id, n]) => `<button data-s="${id}">${n}</button>`).join("") + '<span class="ver">v15</span>';
document.getElementById("nav").onclick = e => { const b = e.target.closest("[data-s]"); if (b) show(b.dataset.s); };
function fit() { const k = Math.min((innerWidth - 40) / 1180, (innerHeight - 100) / 740, 1.25); document.getElementById("scaler").style.transform = `translate(-50%,-50%) scale(${k})`; }
addEventListener("resize", fit); fit();
show("film");
</script>
</body>
</html>
